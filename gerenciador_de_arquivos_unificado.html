            const hist = browserHistories.get(wrap);
            if (!hist) return;
            const backBtn = wrap.querySelector('.browser-back');
            const forwardBtn = wrap.querySelector('.browser-forward');
            if (backBtn) backBtn.disabled = hist.index <= 0;
            if (forwardBtn) forwardBtn.disabled = hist.index >= hist.urls.length - 1;
        }

        // Se o texto digitado não parece um link, pesquisa no Google em vez de tentar abrir direto
        function resolveBrowserUrl(raw) {
            let url = raw.trim();
            if (!url) return '';
            if (/^https?:\/\//i.test(url)) return url;
            if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(url) && !url.includes(' ')) return 'https://' + url;
            return 'https://www.google.com/search?q=' + encodeURIComponent(url);
        }

        function browserNavigate(inputEl) {
            const wrap = inputEl.closest('.browser-container');
            const url = resolveBrowserUrl(inputEl.value);
            if (!url) return;
            inputEl.value = url;
            wrap.querySelector('.browser-frame').src = url;
            const hist = browserHistories.get(wrap) || { urls: [], index: -1 };
            // Navegar pra um link novo descarta qualquer histórico de "avançar" que existia
            hist.urls = hist.urls.slice(0, hist.index + 1);
            hist.urls.push(url);
            hist.index = hist.urls.length - 1;
            browserHistories.set(wrap, hist);
            updateBrowserNavButtons(wrap);
            closeBrowserMenu(wrap);
            playUiSound(500);
        }

        function browserGoBack(btn) {
            const wrap = btn.closest('.browser-container');
            const hist = browserHistories.get(wrap);
            if (!hist || hist.index <= 0) return;
            hist.index--;
            const url = hist.urls[hist.index];
            wrap.querySelector('.browser-frame').src = url;
            wrap.querySelector('.browser-input').value = url;
            updateBrowserNavButtons(wrap);
            playUiSound(420);
        }

        function browserGoForward(btn) {
            const wrap = btn.closest('.browser-container');
            const hist = browserHistories.get(wrap);
            if (!hist || hist.index >= hist.urls.length - 1) return;
            hist.index++;
            const url = hist.urls[hist.index];
            wrap.querySelector('.browser-frame').src = url;
            wrap.querySelector('.browser-input').value = url;
            updateBrowserNavButtons(wrap);
            playUiSound(420);
        }

        function toggleBrowserMenu(btn) {
            const wrap = btn.closest('.browser-container');
            const menu = wrap.querySelector('.browser-menu');
            const willOpen = !menu.classList.contains('open');
            document.querySelectorAll('.browser-menu.open').forEach(m => m.classList.remove('open'));
            if (willOpen) menu.classList.add('open');
        }

        function closeBrowserMenu(wrap) {
            const menu = wrap.querySelector('.browser-menu');
            if (menu) menu.classList.remove('open');
        }

        document.addEventListener('click', (e) => {
            if (e.target.closest('.browser-menu-btn') || e.target.closest('.browser-menu')) return;
            document.querySelectorAll('.browser-menu.open').forEach(m => m.classList.remove('open'));
        });

        // Abre uma nova janela de Navegador já na mesma página da atual (equivalente a "nova aba")
        function openNewBrowserWindow(btn) {
            const wrap = btn.closest('.browser-container');
            const url = wrap.querySelector('.browser-input').value || 'https://www.wikipedia.org';
            closeBrowserMenu(wrap);
            createWindow('Navegador Web v3', 'browser', { url });
        }

        // Zoom simples da página carregada no iframe
        function browserZoom(btn, dir) {
            const wrap = btn.closest('.browser-container');
            const frame = wrap.querySelector('.browser-frame');
            let z = parseFloat(frame.dataset.zoom || '1');
            z = Math.min(2, Math.max(0.5, +(z + dir * 0.1).toFixed(2)));
            frame.dataset.zoom = z;
            frame.style.transformOrigin = 'top left';
            frame.style.transform = `scale(${z})`;
            frame.style.width = `${(100 / z).toFixed(2)}%`;
            frame.style.height = `${(100 / z).toFixed(2)}%`;
            closeBrowserMenu(wrap);
            playUiSound(z > 1 ? 620 : 560);
        }

        // Abre o "ver código-fonte" da página atual numa janela própria.
        // Obs.: "view-source:" foi removido porque os navegadores bloqueiam esse
        // esquema dentro de iframe (por isso a janela abria em branco). Agora o
        // código é buscado por fora (via um proxy público) e mostrado como texto puro.
        function browserInspect(btn) {
            const wrap = btn.closest('.browser-container');
            const url = wrap.querySelector('.browser-input').value;
            closeBrowserMenu(wrap);
            if (!url) return;
            createWindow('Código-Fonte', 'source-view', { url });
        }

        // Constrói a janela de código-fonte (começa em "carregando" e é preenchida depois)
        function buildSourceViewHTML(url) {
            return `<div class="source-view-wrap" style="height:100%; overflow:auto; padding:12px; box-sizing:border-box;">
                <div class="source-view-status" style="opacity:.75; font-size:13px; margin-bottom:8px;">Carregando código-fonte de ${escapeHtmlText(url)}…</div>
                <pre class="source-view-pre" style="white-space:pre-wrap; word-break:break-all; font-family:monospace; font-size:12px; margin:0;"></pre>
            </div>`;
        }

        // Busca o HTML da página (via proxy público, pois o navegador bloqueia
        // isso diretamente por segurança entre origens diferentes) e preenche a janela
        function loadSourceView(container, url) {
            const statusEl = container.querySelector('.source-view-status');
            const preEl = container.querySelector('.source-view-pre');
            fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url))
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
                .then(text => {
                    if (statusEl) statusEl.textContent = 'Código-fonte de ' + url + ':';
                    if (preEl) preEl.textContent = text;
                })
                .catch(() => {
                    if (statusEl) statusEl.textContent = 'Não foi possível carregar o código-fonte (o site pode estar bloqueando o acesso).';
                });
        }

        // Abre a janela de "Criar App do Site" já com o link da página atual preenchido
        function openSiteAppCreatorFromBrowser(btn) {
            const wrap = btn.closest('.browser-container');
            const url = wrap.querySelector('.browser-input').value;
            closeBrowserMenu(wrap);
            createWindow('Criar App do Site', 'site-app-creator', { url });
        }

        // ===== CRIAR APP DE UM SITE (ícone + nome + link, vira um app na Biblioteca) =====
        function buildSiteAppCreatorHTML(prefillUrl) {
            return `
                <div class="factory-container">
                    <div class="factory-fields" style="flex-wrap:wrap;">
                        <input type="text" class="site-app-name" placeholder="Nome do App" style="flex:1;">
                        <input type="text" class="site-app-url" placeholder="Link do site (https://...)" value="${prefillUrl || ''}" style="flex:2;">
                    </div>
                    <div class="factory-fields" style="flex-wrap:wrap;">
                        <input type="text" class="site-app-icon-url" placeholder="Link da imagem (capa do app)" style="flex:2;" oninput="applySiteAppIconUrl(this)">
                        <button class="factory-btn factory-btn-secondary" onclick="triggerSiteAppImageUpload(this)" title="Ou escolher um arquivo de imagem do computador">🖼️ Enviar arquivo</button>
                        <input type="file" class="site-app-image-input" accept="image/*" style="display:none" onchange="previewSiteAppImage(this)">
                    </div>
                    <div class="site-app-preview-row">
                        <img class="site-app-icon-preview" src="" alt="">
                        <span class="opt-empty" style="margin:0;">Capa do app (opcional) — sem imagem, usa a inicial do nome</span>
                    </div>
                    <div class="setting-row" style="padding: 0 15px;">
                        <span>Salvar em</span>
                        <select class="site-app-destination settings-select">
                            <option value="library" selected>Biblioteca</option>
                            <option value="dock">Barra</option>
                        </select>
                    </div>
                    <div style="padding: 15px;">
                        <button class="factory-btn" onclick="addSiteApp(this)">➕ Adicionar App</button>
                    </div>
                </div>`;
        }

        // Preenche a pré-visualização da capa a partir de um link de imagem colado pelo usuário
        function applySiteAppIconUrl(input) {
            const container = input.closest('.factory-container');
            const preview = container.querySelector('.site-app-icon-preview');
            const url = input.value.trim();
            if (url) {
                preview.src = url;
                preview.style.display = 'block';
            } else {
                preview.src = '';
                preview.style.display = 'none';
            }
        }

        function triggerSiteAppImageUpload(btn) {
            btn.closest('.factory-container').querySelector('.site-app-image-input').click();
        }

        function previewSiteAppImage(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const container = input.closest('.factory-container');
            const preview = container.querySelector('.site-app-icon-preview');
            const urlField = container.querySelector('.site-app-icon-url');
            if (urlField) urlField.value = '';
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                playUiSound(600);
            };
            reader.readAsDataURL(file);
        }

        function addSiteApp(btn) {
            const container = btn.closest('.factory-container');
            const url = resolveBrowserUrl(container.querySelector('.site-app-url').value);
            if (!url) { alert('Preencha o link do site.'); return; }
            const name = container.querySelector('.site-app-name').value.trim() || url.replace(/^https?:\/\//, '').split('/')[0];
            const icon = container.querySelector('.site-app-icon-preview').src && container.querySelector('.site-app-icon-preview').style.display !== 'none'
                ? container.querySelector('.site-app-icon-preview').src : '';
            const destination = container.querySelector('.site-app-destination').value;
            customApps.push({ id: customAppIdSeq++, name, url, icon });
            const newIndex = customApps.length - 1;
            refreshLibraryPanels();
            if (destination === 'dock') {
                pinAppToDock(newIndex);
                alert('Atalho do site adicionado na barra!');
            } else {
                playUiSound(700);
                alert('App do site criado! Acesse a Biblioteca de Apps.');
            }
            btn.closest('.vr-window-container').querySelector('.win-close').click();
        }

        // --- CONTROLE DE FOCO (traz a janela clicada para frente) ---
        let topZIndex = 1000;
        function bringToFront(container) {
            topZIndex++;
            container.style.zIndex = topZIndex;
            container.dataset.lastActive = Date.now();
        }

        // --- ARRASTE MOUSE TRADICIONAL ---
        let activeDrag = null;
        let startX, startY, initialLeft, initialTop;

        function startDrag(e, element) {
            bringToFront(element);
            activeDrag = element;
            startX = e.clientX;
            startY = e.clientY;
            initialLeft = element.getBoundingClientRect().left;
            initialTop = element.getBoundingClientRect().top;
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        }

        function onDrag(e) {
            if (!activeDrag) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            const winEl = activeDrag.querySelector('.vr-window');
            const w = winEl ? winEl.offsetWidth : 350;

            // Trava a janela dentro da tela e acima do dock, pra header/controles nunca ficarem inacessíveis
            let newLeft = initialLeft + dx;
            let newTop = initialTop + dy;
            newLeft = Math.min(Math.max(newLeft, -w * 0.6), window.innerWidth - 80);
            newTop = Math.min(Math.max(newTop, 0), window.innerHeight - 140);

            activeDrag.style.left = `${newLeft}px`;
            activeDrag.style.top = `${newTop}px`;
            makeSpatial(activeDrag);
        }

        function stopDrag() {
            activeDrag = null;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        // --- REDIMENSIONAMENTO REAL DA JANELA ---
        let activeResize = null;
        let resizeStartX, resizeStartY, resizeStartW, resizeStartH;

        let activeResizeScaleX = 1, activeResizeScaleY = 1;

        // Lê o scaleX/scaleY que a janela tem no momento (curvatura/inclinação
        // espacial) a partir da matriz de transform já aplicada no rotor.
        // Sem isso, arrastar a alça do canto move a largura/altura em pixels de
        // TELA, mas a janela está visualmente escalada (scaleX/scaleY) — daí o
        // "canto que não funciona direito": o cursor descola da borda da janela
        // conforme ela gira. Compensando pela escala atual, o redimensionamento
        // acompanha o cursor com precisão em qualquer ângulo.
        function getSpatialScale(container) {
            const rotor = container.querySelector('.vr-window-rotor');
            if (!rotor) return { sx: 1, sy: 1 };
            const transform = getComputedStyle(rotor).transform;
            if (!transform || transform === 'none') return { sx: 1, sy: 1 };
            try {
                const m = new DOMMatrix(transform);
                return { sx: Math.abs(m.a) || 1, sy: Math.abs(m.d) || 1 };
            } catch (err) {
                return { sx: 1, sy: 1 };
            }
        }

        function startResize(e, container) {
            e.stopPropagation();
            bringToFront(container);
            activeResize = container.querySelector('.vr-window');
            const scale = getSpatialScale(container);
            activeResizeScaleX = scale.sx;
            activeResizeScaleY = scale.sy;
            resizeStartX = e.clientX;
            resizeStartY = e.clientY;
            resizeStartW = activeResize.offsetWidth;
            resizeStartH = activeResize.offsetHeight;
            document.addEventListener('mousemove', onResize);
            document.addEventListener('mouseup', stopResize);
        }

        function onResize(e) {
            if (!activeResize) return;
            const dx = (e.clientX - resizeStartX) / activeResizeScaleX;
            const dy = (e.clientY - resizeStartY) / activeResizeScaleY;
            const newW = Math.min(Math.max(resizeStartW + dx, 350), window.innerWidth - 60);
            const newH = Math.min(Math.max(resizeStartH + dy, 250), window.innerHeight - 60);
            activeResize.style.width = `${newW}px`;
            activeResize.style.height = `${newH}px`;
        }

        function stopResize() {
            activeResize = null;
            document.removeEventListener('mousemove', onResize);
            document.removeEventListener('mouseup', stopResize);
        }

        // --- MINIMIZAR / RESTAURAR ---
        function toggleMinimize(btn) {
            const container = btn.closest('.vr-window-container');
            container.classList.toggle('minimized');
            bringToFront(container);
        }

        // --- MAXIMIZAR / TELA CHEIA ---
        // Guarda posição, tamanho e estado de curvatura da janela antes de
        // expandir, pra poder devolver tudo exatamente como estava ao sair
        // da tela cheia.
        function toggleMaximize(btn) {
            const container = btn.closest('.vr-window-container');
            const windowEl = container.querySelector('.vr-window');

            // Só uma janela por vez em tela cheia: se já tem outra
            // maximizada, restaura ela antes de expandir essa.
            if (!container.classList.contains('maximized')) {
                const otherMax = document.querySelector('.vr-window-container.maximized');
                if (otherMax && otherMax !== container) {
                    const otherBtn = otherMax.querySelector('.win-max');
                    if (otherBtn) toggleMaximize(otherBtn);
                }
            }

            if (container.classList.contains('maximized')) {
                // Restaura estado anterior
                container.classList.remove('maximized');
                btn.classList.remove('max-active');
                btn.title = 'Tela cheia';

                if (container.dataset.preMaxLeft !== undefined) {
                    container.style.left = container.dataset.preMaxLeft;
                    container.style.top = container.dataset.preMaxTop;
                    windowEl.style.width = container.dataset.preMaxWidth;
                    windowEl.style.height = container.dataset.preMaxHeight;
                    container.dataset.flatMode = container.dataset.preMaxFlat;
                    container.dataset.zDepth = container.dataset.preMaxZDepth;

                    const flatBtn = container.querySelector('.win-flat');
                    if (flatBtn) flatBtn.classList.toggle('flat-active', container.dataset.flatMode === '1');

                    delete container.dataset.preMaxLeft;
                    delete container.dataset.preMaxTop;
                    delete container.dataset.preMaxWidth;
                    delete container.dataset.preMaxHeight;
                    delete container.dataset.preMaxFlat;
                    delete container.dataset.preMaxZDepth;
                }

                if (container.classList.contains('minimized')) container.classList.remove('minimized');
                makeSpatial(container);
            } else {
                // Sai do modo minimizado se estiver, e guarda estado atual
                container.classList.remove('minimized');
                container.dataset.preMaxLeft = container.style.left;
                container.dataset.preMaxTop = container.style.top;
                container.dataset.preMaxWidth = windowEl.style.width || `${windowEl.offsetWidth}px`;
                container.dataset.preMaxHeight = windowEl.style.height || `${windowEl.offsetHeight}px`;
                container.dataset.preMaxFlat = container.dataset.flatMode || '0';
                container.dataset.preMaxZDepth = container.dataset.zDepth || '0';

                // Fica plana (sem curvatura/rotação) enquanto em tela cheia
                container.dataset.flatMode = '1';
                container.dataset.zDepth = '0';

                container.classList.add('maximized');
                btn.classList.add('max-active');
                btn.title = 'Sair da tela cheia (Esc)';
                bringToFront(container);
                makeSpatial(container);
            }
            container.classList.remove('header-visible');
            playUiSound(container.classList.contains('maximized') ? 800 : 500);
        }

        // Revela o cabeçalho da janela maximizada quando o mouse (ou toque)
        // encosta perto do topo da tela, e esconde de novo quando afasta.
        document.addEventListener('mousemove', (e) => {
            const maxContainer = document.querySelector('.vr-window-container.maximized');
            if (!maxContainer) return;
            if (e.clientY < 60) maxContainer.classList.add('header-visible');
            else if (e.clientY > 100) maxContainer.classList.remove('header-visible');
        });

        // Tecla Esc sai da tela cheia da janela maximizada atual
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            const maxContainer = document.querySelector('.vr-window-container.maximized');
            if (!maxContainer) return;
            const maxBtn = maxContainer.querySelector('.win-max');
            if (maxBtn) toggleMaximize(maxBtn);
        });

        // --- MOTOR DE CÁLCULO ESPACIAL (pseudo-3D em 2D puro) ---
        // Aplica a mesma curvatura espacial 2D-segura das janelas (scaleX + skewY,
        // baseada na posição horizontal na tela) num painel flutuante avulso
        // (popup do launcher, menus de contexto, etc.), pra ele também parecer um
        // painel curvo de vidro no espaço, igual ao Meta Quest — sem o bug de clique
        // que um transform 3D verdadeiro (rotateY) causaria nos itens dele.
        function spatializeFloatingPanel(outerEl, innerSelector, curveFactor = 14) {
            if (!outerEl) return;
            const inner = outerEl.querySelector(innerSelector);
            if (!inner) return;
            const rect = outerEl.getBoundingClientRect();
            const screenWidth = window.innerWidth || 1;
            const centerX = rect.left + rect.width / 2;
            const distanceFromCenter = (centerX - screenWidth / 2) / (screenWidth / 2);
            const angleDeg = distanceFromCenter * -curveFactor * globalCurvatureMultiplier;
            const angleRad = angleDeg * Math.PI / 180;
            const scaleX = Math.max(0.88, Math.cos(angleRad));
            const skewYDeg = angleDeg * 0.18;
            inner.style.transform = `scaleX(${scaleX.toFixed(4)}) skewY(${skewYDeg.toFixed(2)}deg)`;
        }

        // Reinicia uma animação CSS já declarada na folha de estilos (usada pros
        // menus de contexto reaproveitados, que não são recriados no DOM a cada
        // abertura — sem isso, a animação "dcmPopIn" só tocaria da primeira vez).
        function replayCssAnimation(el) {
            if (!el) return;
            el.style.animation = 'none';
            void el.offsetWidth;
            el.style.animation = '';
        }

        function makeSpatial(element) {
            const rect = element.getBoundingClientRect();
            const screenWidth = window.innerWidth;
            const centerX = rect.left + rect.width / 2;

            // Janela marcada como "Plana" (botão ◻ no cabeçalho) ignora toda
            // a curvatura espacial, automática ou manual, e fica sempre 2D.
            const isFlat = element.dataset.flatMode === '1';

            // Curvatura panorâmica automática baseada na posição X horizontal
            const distanceFromCenter = (centerX - screenWidth / 2) / (screenWidth / 2);
            const autoAngle = isFlat ? 0 : distanceFromCenter * -24 * globalCurvatureMultiplier;

            // Giro manual do usuário (botões ⇄ / ⇅, ver toggleRotateMode), somado à curvatura automática.
            // Horizontal (⇄) se soma ao ângulo automático; vertical (⇅) é um eixo novo, só manual.
            const manualH = isFlat ? 0 : (parseFloat(element.dataset.manualTiltH) || 0);
            const manualV = isFlat ? 0 : (parseFloat(element.dataset.manualTiltV) || 0);
            const angleDeg = autoAngle + manualH;

            const angleRad = angleDeg * Math.PI / 180;
            const vRad = manualV * Math.PI / 180;

            // Profundidade (Eixo Z): pinch da mão OU a rodinha do mouse sobre a área de arrastar
            const zDepth = parseFloat(element.dataset.zDepth) || 0;
            const depthScale = Math.min(Math.max(1 + zDepth / 1200, 0.82), 1.22);

            // Foreshortening + keystone em 2D puro pros dois eixos (veja o comentário
            // grande em cima de .vr-window-rotor no <style> — é o que mantém os cliques
            // 100% confiáveis mesmo com a janela bem girada).
            const scaleX = Math.max(0.78, Math.cos(angleRad)) * depthScale;
            const scaleY = Math.max(0.78, Math.cos(vRad)) * depthScale;
            const skewYDeg = angleDeg * 0.24;
            const skewXDeg = manualV * 0.24;

            const rotorElement = element.querySelector('.vr-window-rotor');
            if (rotorElement) {
                rotorElement.style.transform =
                    `scaleX(${scaleX.toFixed(4)}) scaleY(${scaleY.toFixed(4)}) skewX(${skewXDeg.toFixed(2)}deg) skewY(${skewYDeg.toFixed(2)}deg)`;
                // Sombra/brilho reagem à profundidade: janela "puxada" pra frente flutua mais,
                // "empurrada" pra trás fica mais discreta — reforça a sensação de espaço 3D.
                const windowEl = rotorElement.querySelector('.vr-window');
                if (windowEl && !performanceMode) {
                    const lift = 50 + zDepth * 0.18;
                    windowEl.style.boxShadow =
                        `0 ${lift}px ${100 + zDepth * 0.3}px rgba(0,0,0,0.85),
                         inset 0 1px 3px rgba(255,255,255,0.5),
                         0 0 ${30 + Math.max(zDepth, 0) * 0.4}px rgba(0, 102, 254, ${0.15 + Math.max(zDepth, 0) / 1500})`;
                } else if (windowEl && performanceMode) {
                    windowEl.style.boxShadow = '0 20px 40px rgba(0,0,0,0.7)';
                }
            }
        }

        // --- GIRO MANUAL (botões ⇄ / ⇅ no cabeçalho) ---
        // Clica no botão pra "armar" aquele eixo daquela janela; enquanto armado (botão
        // aceso), a rodinha do mouse ou as setas do teclado giram a janela nesse eixo.
        // Clicar de novo (ou clicar fora) desarma.
        let armedRotate = null; // { container, btn, axis: 'h' | 'v' }
        const ROTATE_STEP = 4;   // graus por "tique" de seta/scroll
        const ROTATE_LIMIT = 55; // limite manual, pra não achatar demais a janela

        function toggleRotateMode(btn, axis) {
            const container = btn.closest('.vr-window-container');
            if (armedRotate && armedRotate.container === container && armedRotate.axis === axis) {
                disarmRotate();
                return;
            }
            disarmRotate();
            armedRotate = { container, btn, axis };
            btn.classList.add('armed');
            bringToFront(container);
        }

        function disarmRotate() {
            if (armedRotate) armedRotate.btn.classList.remove('armed');
            armedRotate = null;
        }

        // --- BOTÃO PLANA/CURVA POR JANELA ---
        function toggleFlatMode(btn) {
            const container = btn.closest('.vr-window-container');
            const nowFlat = container.dataset.flatMode !== '1';
            container.dataset.flatMode = nowFlat ? '1' : '0';
            btn.classList.toggle('flat-active', nowFlat);
            btn.title = nowFlat ? 'Janela Plana (clique para tornar Curva)' : 'Janela Curva (clique para tornar Plana)';
            makeSpatial(container);
            playUiSound(nowFlat ? 500 : 700);
        }

        // --- AUTO-ATUALIZAÇÃO POR JANELA ---
        function toggleAutoUpdate(btn) {
            if (!autoUpdateFeatureEnabled) {
                alert('A função de Auto-Atualização está desativada nas Configurações do Sistema.');
                return;
            }
            const container = btn.closest('.vr-window-container');
            if (btn.classList.contains('auto-active')) {
                stopAutoUpdate(btn);
            } else {
                startAutoUpdate(btn, container);
            }
        }

        function startAutoUpdate(btn, container, silent) {
            stopAutoUpdate(btn); // limpa timer anterior, se houver
            btn.classList.add('auto-active');
            if (!silent) playUiSound(800);
            const timerId = setInterval(() => refreshWindowContent(container), autoUpdateIntervalMs);
            autoUpdateTimers.set(container, timerId);
        }

        function stopAutoUpdate(btn) {
            const container = btn.closest('.vr-window-container');
            const timerId = autoUpdateTimers.get(container);
            if (timerId) clearInterval(timerId);
            autoUpdateTimers.delete(container);
            btn.classList.remove('auto-active');
        }

        // Atualiza o conteúdo da janela de acordo com o tipo do app. Sempre
        // dá um "flash" visual pra indicar que a atualização aconteceu.
        function refreshWindowContent(container) {
            if (!autoUpdateFeatureEnabled || !document.body.contains(container)) return;
            const type = container.dataset.winType;
            const contentEl = container.querySelector('.window-content');

            if (type === 'library') {
                const grid = contentEl.querySelector('.app-grid');
                if (grid) grid.innerHTML = buildAppGridItemsHTML();
            } else if (type === 'optimizer') {
                renderOptimizerStats(container);
            } else if (type === 'browser') {
                const frame = contentEl.querySelector('.browser-frame');
                if (frame) frame.src = frame.src;
            } else if (type === 'app') {
                const frame = contentEl.querySelector('.app-sandbox');
                if (frame) frame.contentWindow && frame.contentWindow.location.reload();
            }
            // Feedback visual em qualquer tipo de janela
            contentEl.classList.remove('refresh-flash');
            void contentEl.offsetWidth; // força reflow pra reiniciar a animação
            contentEl.classList.add('refresh-flash');
            makeSpatial(container);
        }

        function applyManualRotate(container, axis, delta) {
            const key = axis === 'h' ? 'manualTiltH' : 'manualTiltV';
            let current = parseFloat(container.dataset[key]) || 0;
            current = Math.min(Math.max(current + delta, -ROTATE_LIMIT), ROTATE_LIMIT);
            container.dataset[key] = current;
            makeSpatial(container);
        }

        // Desarma clicando fora de qualquer botão de giro
        document.addEventListener('mousedown', (e) => {
            if (armedRotate && !e.target.closest('.win-rotate')) disarmRotate();
        });

        // Setas do teclado giram o eixo armado
        window.addEventListener('keydown', (e) => {
            if (!armedRotate) return;
            const { container, axis } = armedRotate;
            if (axis === 'h' && e.key === 'ArrowLeft') { applyManualRotate(container, 'h', -ROTATE_STEP); e.preventDefault(); }
            else if (axis === 'h' && e.key === 'ArrowRight') { applyManualRotate(container, 'h', ROTATE_STEP); e.preventDefault(); }
            else if (axis === 'v' && e.key === 'ArrowUp') { applyManualRotate(container, 'v', -ROTATE_STEP); e.preventDefault(); }
            else if (axis === 'v' && e.key === 'ArrowDown') { applyManualRotate(container, 'v', ROTATE_STEP); e.preventDefault(); }
        });

        // Rodinha do mouse gira o eixo armado (em qualquer lugar da tela, exceto em
        // cima da área de arrastar — lá a rodinha empurra a profundidade, ver pushDepth)
        window.addEventListener('wheel', (e) => {
            if (!armedRotate) return;
            e.preventDefault();
            applyManualRotate(armedRotate.container, armedRotate.axis, e.deltaY > 0 ? ROTATE_STEP : -ROTATE_STEP);
        }, { passive: false });

        // --- EMPURRAR JANELA PRA FRENTE/TRÁS COM A RODINHA DO MOUSE ---
        // Só ativo sobre o cabeçalho ou a barrinha de arrastar (área de "segurar" a janela).
        function pushDepth(e, dragArea) {
            e.preventDefault();
            e.stopPropagation(); // não deixa isso também acionar o giro manual acima
            const container = dragArea.closest('.vr-window-container');
            bringToFront(container);
            let z = parseFloat(container.dataset.zDepth) || 0;
            // rodinha pra cima (deltaY negativo) = empurra pra frente (mais perto de você)
            z += (e.deltaY < 0 ? 1 : -1) * 22;
            z = Math.min(Math.max(z, -zDepthLimit), zDepthLimit * 1.2);
            container.dataset.zDepth = z;
            makeSpatial(container);
        }

        function updateAllWindowsSpatial() {
            document.querySelectorAll('.vr-window-container').forEach(win => makeSpatial(win));
        }

        // --- ANCORAGEM ESPACIAL (📍): janelas "fixas no ar" que reagem a passos reais ---
        // Ideia: em vez de zDepth só mudar por pinça/rodinha, uma janela ancorada guarda
        // a direção (heading) em que você estava olhando quando ativou a ancoragem. A
        // cada passo detectado pelo acelerômetro, projetamos o passo nessa direção: andar
        // "de frente" empurra a janela pra mais perto (zDepth sobe), dar meia-volta e andar
        // puxa ela pra longe (zDepth desce) — exatamente como um objeto fixo no mundo real.
        const DEG2RAD_WALK = Math.PI / 180;
        const STEP_ZDEPTH_GAIN = 26;      // quanto o zDepth muda por passo detectado
        const STEP_ACCEL_THRESHOLD = 1.6; // pico de aceleração (m/s²) que conta como passo
        const STEP_DEBOUNCE_MS = 300;     // tempo mínimo entre passos, evita duplicar

        let spatialWalkActive = false;
        let walkHeadingRef = 0;          // heading (rad) capturado ao ativar a ancoragem
        let currentDeviceHeading = 0;    // heading (rad) atualizado a cada evento de orientação
        let lastAccelMag = 9.8;
        let lastStepTime = 0;
        let walkStepCount = 0;

        function anchoredWindows() {
            return Array.from(document.querySelectorAll('.vr-window-container')).filter(c => c.dataset.anchored === '1');
        }

        function toggleWindowAnchor(btn) {
            const container = btn.closest('.vr-window-container');
            const nowAnchored = container.dataset.anchored !== '1';
            container.dataset.anchored = nowAnchored ? '1' : '0';
            btn.classList.toggle('anchor-active', nowAnchored);
            btn.title = nowAnchored
                ? 'Janela ancorada no ar (clique para soltar)'
                : 'Fixar esta janela no ar: ande de verdade pra se aproximar ou se afastar dela';
            playUiSound(nowAnchored ? 620 : 400);

            if (nowAnchored) {
                // Primeira janela ancorada liga o motor de passos, se ainda não estiver ativo
                enableSpatialWalk();
                filemgrToast('📍 Janela ancorada: ela agora fica fixa no ar. Ande de verdade pra se aproximar ou se afastar dela.');
            } else if (anchoredWindows().length === 0) {
                disableSpatialWalk();
            }
        }

        async function enableSpatialWalk() {
            if (spatialWalkActive) {
                // Já ativo: só recaptura a direção de referência a partir de agora
                walkHeadingRef = currentDeviceHeading;
                return;
            }

            try {
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    const p1 = await DeviceMotionEvent.requestPermission();
                    if (p1 !== 'granted') throw new Error('permissão de movimento negada');
                }
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const p2 = await DeviceOrientationEvent.requestPermission();
                    if (p2 !== 'granted') throw new Error('permissão de orientação negada');
                }
            } catch (err) {
                filemgrToast('⚠️ Sensores de movimento indisponíveis (' + err.message + '). Use as setas ↑ ↓ do teclado pra simular passos.');
            }

            window.addEventListener('devicemotion', handleAnchorMotion, true);
            window.addEventListener('deviceorientation', handleAnchorOrientation, true);

            walkHeadingRef = currentDeviceHeading;
            walkStepCount = 0;
            spatialWalkActive = true;

            const badge = document.getElementById('walk-anchor-badge');
            if (badge) badge.style.display = 'flex';
            updateWalkBadge();
        }

        function disableSpatialWalk() {
            window.removeEventListener('devicemotion', handleAnchorMotion, true);
            window.removeEventListener('deviceorientation', handleAnchorOrientation, true);
            spatialWalkActive = false;
            const badge = document.getElementById('walk-anchor-badge');
            if (badge) badge.style.display = 'none';
        }

        function handleAnchorOrientation(e) {
            let alpha = e.alpha;
            if (alpha === null || alpha === undefined) return;
            if (typeof e.webkitCompassHeading === 'number') {
                alpha = 360 - e.webkitCompassHeading; // iOS entrega heading verdadeiro direto
            }
            currentDeviceHeading = alpha * DEG2RAD_WALK;
        }

        function handleAnchorMotion(e) {
            const a = e.accelerationIncludingGravity || e.acceleration;
            if (!a || a.x === null || a.x === undefined) return;
            const mag = Math.sqrt((a.x || 0) ** 2 + (a.y || 0) ** 2 + (a.z || 0) ** 2);
            const delta = mag - lastAccelMag;
            lastAccelMag = lastAccelMag * 0.9 + mag * 0.1; // filtro passa-baixa, suaviza a gravidade

            const now = performance.now();
            if (delta > STEP_ACCEL_THRESHOLD && (now - lastStepTime) > STEP_DEBOUNCE_MS) {
                lastStepTime = now;
                registerWalkStep();
            }
        }

        function registerWalkStep() {
            walkStepCount++;
            // Projeta o passo na direção de referência: 1 = andando de frente (aproxima),
            // -1 = andando de costas/virado (afasta), valores intermediários em diagonal.
            const forwardComponent = Math.cos(currentDeviceHeading - walkHeadingRef);
            applyWalkDelta(forwardComponent * STEP_ZDEPTH_GAIN);
            updateWalkBadge();
        }

        function applyWalkDelta(delta) {
            anchoredWindows().forEach(container => {
                let z = parseFloat(container.dataset.zDepth) || 0;
                z += delta;
                z = Math.min(Math.max(z, -zDepthLimit), zDepthLimit * 1.2);
                container.dataset.zDepth = z;
                makeSpatial(container);
            });
        }

        function updateWalkBadge() {
            const textEl = document.getElementById('walk-anchor-text');
            if (textEl) textEl.textContent = `📍 ${anchoredWindows().length} janela(s) ancorada(s) · ${walkStepCount} passo(s)`;
        }

        // Fallback de teclado (desktop, sem sensores de celular): setas ↑ ↓ simulam
        // um passo pra frente/trás na direção de referência, só quando a ancoragem
        // está ativa e nenhum eixo de giro manual está "armado" no momento.
        window.addEventListener('keydown', (e) => {
            if (!spatialWalkActive || armedRotate) return;
            if (e.key === 'ArrowUp') { walkStepCount++; applyWalkDelta(STEP_ZDEPTH_GAIN); updateWalkBadge(); e.preventDefault(); }
            else if (e.key === 'ArrowDown') { walkStepCount++; applyWalkDelta(-STEP_ZDEPTH_GAIN); updateWalkBadge(); e.preventDefault(); }
        });

        // ============================================================
        // --- SISTEMA DE OTIMIZAÇÃO DE APPS ---
        // Painel único que combina: (1) monitor de performance simulado
        // (FPS/CPU/RAM), (2) gerenciador das janelas/apps abertos com
        // fechamento em massa, e (3) um botão "Otimizar Agora" que
        // minimiza janelas ociosas, pausa auto-atualizações em segundo
        // plano e ativa o Modo de Desempenho quando há muitas janelas.
        // ============================================================

        function buildOptimizerHTML() {
            return `
                <div class="optimizer-pane">
                    <div class="opt-stats-grid">
                        <div class="opt-stat-card">
                            <div class="opt-stat-label">FPS Simulado</div>
                            <div class="opt-stat-value" id="opt-fps-value">--</div>
                            <div class="opt-stat-bar-bg"><div class="opt-stat-bar-fill" id="opt-fps-bar"></div></div>
                        </div>
                        <div class="opt-stat-card">
                            <div class="opt-stat-label">CPU</div>
                            <div class="opt-stat-value" id="opt-cpu-value">--%</div>
                            <div class="opt-stat-bar-bg"><div class="opt-stat-bar-fill" id="opt-cpu-bar"></div></div>
                        </div>
                        <div class="opt-stat-card">
                            <div class="opt-stat-label">RAM</div>
                            <div class="opt-stat-value" id="opt-ram-value">--</div>
                            <div class="opt-stat-bar-bg"><div class="opt-stat-bar-fill" id="opt-ram-bar"></div></div>
                        </div>
                    </div>

                    <button class="opt-run-btn" onclick="runOptimization(this)">⚡ Otimizar Agora</button>
                    <div class="opt-summary" id="opt-summary">Analisando o ambiente espacial...</div>

                    <div class="opt-toolbar">
                        <span class="settings-section-title" style="margin:0;">Apps &amp; Janelas Abertas</span>
                        <span style="display:flex; gap:8px;">
                            <button class="settings-action-btn" onclick="toggleSelectAllOpt(this)">Selecionar todas</button>
                            <button class="settings-action-btn danger" onclick="closeSelectedOpt(this)">Fechar selecionadas</button>
                        </span>
                    </div>
                    <div class="opt-app-list" id="opt-app-list"></div>
                </div>`;
        }

        // Retorna todas as janelas abertas, exceto o próprio painel Otimizador (se informado)
        function collectOpenWindows(excludeContainer) {
            return Array.from(document.querySelectorAll('.vr-window-container')).filter(c => c !== excludeContainer);
        }

        // "Hardware virtual" simulado a partir do estado real do sistema: quantidade
        // de janelas abertas, quantas têm auto-atualização ligada, hand tracking e
        // câmera ativos, e se o Modo de Desempenho já está ligado.
        function computeSimulatedMetrics(windowsList) {
            const count = windowsList.length;
            const autoCount = windowsList.filter(c => c.querySelector('.win-auto.auto-active')).length;

            let fps = performanceMode ? 90 : 72;
            fps -= count * 2 + autoCount * 3 + (handTrackingActive ? 8 : 0);
            fps = Math.min(90, Math.max(24, Math.round(fps)));

            let cpu = 14 + count * 7 + autoCount * 5 + (handTrackingActive ? (performanceMode ? 14 : 22) : 0) + (streamActive ? 6 : 0) - (performanceMode ? 12 : 0);
            cpu = Math.min(98, Math.max(3, Math.round(cpu)));

            let ram = 260 + count * 165 + customApps.length * 35 + autoCount * 40;
            ram = Math.round(ram);

            return { fps, cpu, ram, count, autoCount };
        }

        function metricColor(pct) {
            if (pct < 50) return '#28c76f';
            if (pct < 80) return '#ffb020';
            return '#ff5f56';
        }

        // Redesenha os cartões de FPS/CPU/RAM e a lista de apps de um painel Otimizador específico
        function renderOptimizerStats(container) {
            if (!document.body.contains(container)) return;
            const list = collectOpenWindows(container);
            const { fps, cpu, ram, count, autoCount } = computeSimulatedMetrics(list);

            const fpsEl = container.querySelector('#opt-fps-value');
            const cpuEl = container.querySelector('#opt-cpu-value');
            const ramEl = container.querySelector('#opt-ram-value');
            if (fpsEl) fpsEl.textContent = `${fps}`;
            if (cpuEl) cpuEl.textContent = `${cpu}%`;
            if (ramEl) ramEl.textContent = `${ram} MB`;

            const fpsBar = container.querySelector('#opt-fps-bar');
            const cpuBar = container.querySelector('#opt-cpu-bar');
            const ramBar = container.querySelector('#opt-ram-bar');
            if (fpsBar) { fpsBar.style.width = `${Math.min(100, fps)}%`; fpsBar.style.background = metricColor(100 - fps); }
            if (cpuBar) { cpuBar.style.width = `${cpu}%`; cpuBar.style.background = metricColor(cpu); }
            if (ramBar) { const ramPct = Math.min(100, ram / 20); ramBar.style.width = `${ramPct}%`; ramBar.style.background = metricColor(ramPct); }

            renderOptimizerAppList(container, list);
        }

        function renderOptimizerAppList(container, list) {
            const listEl = container.querySelector('#opt-app-list');
            if (!listEl) return;

            if (list.length === 0) {
                listEl.innerHTML = `<div class="opt-empty">Nenhum outro app aberto no momento.</div>`;
                return;
            }

            const now = Date.now();
            listEl.innerHTML = list.map((c) => {
                const titleEl = c.querySelector('.window-title');
                const title = titleEl ? titleEl.textContent : 'Janela';
                const type = c.dataset.winType || 'app';
                const minimized = c.classList.contains('minimized');
                const autoActive = !!c.querySelector('.win-auto.auto-active');
                const lastActive = parseFloat(c.dataset.lastActive) || now;
                const idleSec = Math.max(0, Math.round((now - lastActive) / 1000));
                const isFocused = String(c.style.zIndex) === String(topZIndex);
                const isIdle = (now - lastActive) > IDLE_THRESHOLD_MS && !minimized && !isFocused;

                let statusParts = [];
                if (isFocused) statusParts.push('Em foco');
                if (minimized) statusParts.push('Minimizada');
                if (autoActive) statusParts.push('Auto-Atualização');
                if (isIdle) statusParts.push(`Ociosa há ${idleSec}s`);
                const status = statusParts.length ? statusParts.join(' · ') : 'Ativa';

                // Garante um identificador estável pra essa janela, reaproveitado entre re-renders
                if (!c.dataset.optId) c.dataset.optId = `opt-${Math.random().toString(36).slice(2, 9)}`;

                const rowClass = isFocused ? 'active-focus' : (isIdle ? 'idle' : '');

                return `
                    <div class="opt-app-row ${rowClass}" data-opt-target="${c.dataset.optId}">
                        <input type="checkbox" class="opt-select-cb">
                        <div class="opt-app-info">
                            <span class="opt-app-title">${title}</span>
                            <span class="opt-app-meta">${type} · ${status}</span>
                        </div>
                        <div class="opt-app-actions">
                            <button class="opt-mini-btn" title="Minimizar/Restaurar" onclick="optToggleMinimize('${c.dataset.optId}')">–</button>
                            <button class="opt-mini-btn danger" title="Fechar" onclick="optCloseWindow('${c.dataset.optId}')">✕</button>
                        </div>
                    </div>`;
            }).join('');
        }

        function findByOptId(id) {
            return document.querySelector(`.vr-window-container[data-opt-id="${id}"]`);
        }

        function optToggleMinimize(id) {
            const c = findByOptId(id);
            if (!c) return;
            c.classList.toggle('minimized');
            bringToFront(c);
            refreshAllOptimizerPanels();
        }

        function optCloseWindow(id) {
            const c = findByOptId(id);
            if (!c) return;
            const closeBtn = c.querySelector('.win-close');
            if (closeBtn) closeWindowWithCleanup(closeBtn);
            else c.remove();
            refreshAllOptimizerPanels();
        }

        function toggleSelectAllOpt(btn) {
            const panel = btn.closest('.vr-window-container');
            const boxes = panel.querySelectorAll('.opt-select-cb');
            const allChecked = boxes.length > 0 && Array.from(boxes).every(b => b.checked);
            boxes.forEach(b => b.checked = !allChecked);
        }

        function closeSelectedOpt(btn) {
            const panel = btn.closest('.vr-window-container');
            const rows = panel.querySelectorAll('.opt-app-row');
            let closedCount = 0;

            rows.forEach(row => {
                const cb = row.querySelector('.opt-select-cb');
                if (cb && cb.checked) {
                    const id = row.dataset.optTarget;
                    const c = findByOptId(id);
                    if (c) {
                        const closeBtn = c.querySelector('.win-close');
                        if (closeBtn) closeWindowWithCleanup(closeBtn); else c.remove();
                        closedCount++;
                    }
                }
            });

            playUiSound(closedCount ? 300 : 200);
            renderOptimizerStats(panel);

            const summaryEl = panel.querySelector('#opt-summary');
            if (summaryEl) {
                summaryEl.textContent = closedCount
                    ? `🗑️ ${closedCount} app(s) fechado(s) manualmente.`
                    : 'Nenhum app selecionado.';
            }
        }

        // Atualiza todos os painéis Otimizador que estiverem abertos ao mesmo tempo,
        // pra manter a lista de apps sempre sincronizada com o resto do sistema.
        function refreshAllOptimizerPanels() {
            document.querySelectorAll('.vr-window-container').forEach(c => {
                if (c.dataset.winType === 'optimizer') renderOptimizerStats(c);
            });
        }

        // Ação principal: varre as janelas abertas e otimiza automaticamente
        // o que estiver "pesando" sem necessidade — janelas ociosas (sem
        // interação recente e fora de foco) e auto-atualizações rodando em
        // segundo plano. Se houver muitas janelas abertas, também liga o
        // Modo de Desempenho global.
        function runOptimization(btn) {
            const panel = btn.closest('.vr-window-container');
            const list = collectOpenWindows(panel);
            const now = Date.now();

            let minimizedCount = 0;
            let stoppedTimers = 0;

            list.forEach(c => {
                const lastActive = parseFloat(c.dataset.lastActive) || now;
                const idleMs = now - lastActive;
                const isFocused = String(c.style.zIndex) === String(topZIndex);
                const autoBtn = c.querySelector('.win-auto.auto-active');

                // Pausa auto-atualizações em janelas que não estão em foco: economiza
                // ciclos de rede/CPU sem perder o app, que continua aberto normalmente
                if (autoBtn && !isFocused) {
                    stopAutoUpdate(autoBtn);
                    stoppedTimers++;
                }

                // Minimiza janelas paradas há mais tempo que o limiar de ociosidade
                if (idleMs > IDLE_THRESHOLD_MS && !isFocused && !c.classList.contains('minimized')) {
                    c.classList.add('minimized');
                    minimizedCount++;
                }
            });

            let perfActivated = false;
            if (!performanceMode && list.length >= 3) {
                performanceMode = true;
                document.body.classList.add('performance-mode');
                perfActivated = true;
            }

            playUiSound(880);
            renderOptimizerStats(panel);

            const summaryEl = panel.querySelector('#opt-summary');
            if (summaryEl) {
                const parts = [];
                if (minimizedCount) parts.push(`${minimizedCount} janela(s) ociosa(s) minimizada(s)`);
                if (stoppedTimers) parts.push(`${stoppedTimers} auto-atualização(ões) pausada(s)`);
                if (perfActivated) parts.push('Modo de Desempenho ativado');
                summaryEl.textContent = parts.length
                    ? `✅ ${parts.join(' · ')}.`
                    : '✅ Tudo já está otimizado, nenhuma ação necessária.';
            }
        }


        // --- ENGINE DE HAND TRACKING AVANÇADA (ESTILO META QUEST 3) — v2 ---
        // 2 mãos simultâneas, filtro "One Euro" (o mesmo tipo usado em headsets VR reais),
        // glow renderizado via sprite (sem shadowBlur — muito mais rápido), mesh
        // translúcida da palma, raio de apontamento, hover espacial na UI e 3 gestos:
        // pinça (clique/mover fino), punho fechado sobre uma janela (agarrar tudo),
        // mão aberta e espalmada (abre o menu rápido, como o menu de pulso do Quest).
        let handTrackingActive = false;

        // --- Filtro One Euro (Casiez et al.) — suaviza sem "arrastar" o movimento ---
        class OneEuroFilter {
            constructor(minCutoff = 1.1, beta = 0.35, dCutoff = 1.0) {
                this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff;
                this.xPrev = null; this.dxPrev = 0; this.tPrev = null;
            }
            static alpha(cutoff, dt) {
                const tau = 1 / (2 * Math.PI * cutoff);
                return 1 / (1 + tau / dt);
            }
            filter(x, t) {
                if (this.tPrev === null) { this.tPrev = t; this.xPrev = x; return x; }
                const dt = Math.max((t - this.tPrev) / 1000, 0.001);
                this.tPrev = t;
                const dx = (x - this.xPrev) / dt;
                const aD = OneEuroFilter.alpha(this.dCutoff, dt);
                const dxHat = this.dxPrev + aD * (dx - this.dxPrev);
                this.dxPrev = dxHat;
                const cutoff = this.minCutoff + this.beta * Math.abs(dxHat);
                const a = OneEuroFilter.alpha(cutoff, dt);
                const xHat = this.xPrev + a * (x - this.xPrev);
                this.xPrev = xHat;
                return xHat;
            }
        }

        // Conexões ósseas da mão (21 landmarks do MediaPipe)
        const HAND_BONES = [
            [0,1],[1,2],[2,3],[3,4],           // polegar
            [0,5],[5,6],[6,7],[7,8],           // indicador
            [5,9],[9,10],[10,11],[11,12],      // médio
            [9,13],[13,14],[14,15],[15,16],    // anelar
            [13,17],[17,18],[18,19],[19,20],   // mindinho
            [0,17]                             // palma
        ];
        const PALM_OUTLINE = [0, 1, 5, 9, 13, 17]; // contorno da base da mão p/ a mesh translúcida
        const FINGER_TIPS = [4, 8, 12, 16, 20];

        // --- Cache de sprites de glow (evita ctx.shadowBlur, que é MUITO caro por frame) ---
        const glowSpriteCache = new Map();
        function getGlowSprite(hue) {
            // Mão sempre branca agora: um único sprite serve pras duas mãos (menos cache = mais rápido)
            const cacheKey = 'white';
            if (glowSpriteCache.has(cacheKey)) return glowSpriteCache.get(cacheKey);
            const size = 72;
            const c = document.createElement('canvas');
            c.width = size; c.height = size;
            const gctx = c.getContext('2d');
            const grad = gctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
            grad.addColorStop(0, `hsla(0, 0%, 100%, 0.95)`);
            grad.addColorStop(0.4, `hsla(0, 0%, 92%, 0.5)`);
            grad.addColorStop(1, `hsla(0, 0%, 85%, 0)`);
            gctx.fillStyle = grad;
            gctx.beginPath(); gctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2); gctx.fill();
            glowSpriteCache.set(cacheKey, c);
            return c;
        }

        // Estado por mão (até 2 mãos rastreadas em paralelo)
        function createHandSlot(index) {
            return {
                el: document.getElementById(`hand-pointer-${index}`),
                filterX: new OneEuroFilter(1.3, 0.55),
                filterY: new OneEuroFilter(1.3, 0.55),
                smoothedX: window.innerWidth / 2,
                smoothedY: window.innerHeight / 2,
                isPinching: false,
                isGrabbing: false,          // punho fechado segurando uma janela inteira
                windowBeingDragged: null,
                dragOffsetX: 0, dragOffsetY: 0,
                basePinchDepth: 0,
                lastSeen: 0,
                wasVisible: false,
                firstSeenAt: 0,
                hoverTarget: null,
                handedness: 'Right',
                wasOpenPalm: false,
                lastPalmGestureAt: 0
            };
        }
        const handSlots = [createHandSlot(0), createHandSlot(1)];
        const HAND_LOST_TIMEOUT = 260;   // ms — evita "piscar" o ponteiro em falhas curtas de detecção
        const PALM_GESTURE_COOLDOWN = 900; // ms entre acionamentos do gesto de mão aberta
        applyHandSmoothingParams(); // sincroniza o filtro com as configurações atuais do usuário

        const handBtn = document.getElementById('hand-tracking-btn');

        function resetHandSlot(slot) {
            slot.el.classList.remove('visible', 'pinching', 'hand-left');
            slot.isPinching = false;
            slot.isGrabbing = false;
            slot.windowBeingDragged = null;
            slot.wasVisible = false;
            slot.wasOpenPalm = false;
            if (slot.hoverTarget) { slot.hoverTarget.classList.remove('spatial-hover'); slot.hoverTarget = null; }
        }

        function toggleHandTracking() {
            if (!streamActive) {
                alert("Por favor, ative a câmera (Passthrough) antes!");
                return;
            }
            handTrackingActive = !handTrackingActive;
            if (handTrackingActive) {
                if (handBtn) handBtn.classList.add('hand-toggle-active');
            } else {
                if (handBtn) handBtn.classList.remove('hand-toggle-active');
                skeletonCtx.clearRect(0, 0, skeletonCanvas.width, skeletonCanvas.height);
                handSlots.forEach(resetHandSlot);
            }
        }

        const handsEngine = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        handsEngine.setOptions({
            selfieMode: false,              // câmera traseira não é espelhada como uma selfie
            maxNumHands: 2,                 // rastreamento de ambas as mãos, como no Quest 3
            modelComplexity: 0,             // modelo "lite": bem mais rápido, com precisão ótima pros gestos usados aqui
            minDetectionConfidence: 0.65,   // um pouco mais permissivo p/ achar a mão mais rápido
            minTrackingConfidence: 0.55     // mantém o rastreio "travado" na mão por mais tempo, evitando re-detecção cara a cada frame
        });

        // Osso com "glow" em duas camadas (larga/translúcida + fina/nítida) — sem shadowBlur
        function drawGlowBone(ctx, p1, p2, hue, alphaScale) {
            ctx.lineCap = 'round';
            ctx.strokeStyle = `hsla(0, 0%, 90%, ${0.22 * alphaScale})`;
            ctx.lineWidth = 9;
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();

            const grad = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
            grad.addColorStop(0, `hsla(0, 0%, 100%, ${0.95 * alphaScale})`);
            grad.addColorStop(1, `hsla(0, 0%, 94%, ${0.65 * alphaScale})`);
            ctx.strokeStyle = grad;
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        }

        // Junta com glow via sprite pré-renderizado (drawImage é ordens de magnitude mais rápido que shadowBlur)
        function drawGlowJoint(ctx, p, radius, hue, alphaScale) {
            const sprite = getGlowSprite(hue);
            const glowSize = radius * 6.2;
            ctx.globalAlpha = Math.min(1, alphaScale);
            ctx.drawImage(sprite, p.x - glowSize / 2, p.y - glowSize / 2, glowSize, glowSize);
            ctx.globalAlpha = 1;
            ctx.fillStyle = `hsla(0, 0%, 100%, ${0.95 * alphaScale})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        // Mesh translúcida da base da palma — dá a sensação de "presença" de mão, como no Quest 3
        function drawPalmMesh(ctx, pts, hue, alphaScale) {
            ctx.beginPath();
            PALM_OUTLINE.forEach((i, k) => {
                const p = pts[i];
                if (k === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
            });
            ctx.closePath();
            const c = pts[9];
            const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 95);
            grad.addColorStop(0, `hsla(0, 0%, 95%, ${0.16 * alphaScale})`);
            grad.addColorStop(1, `hsla(0, 0%, 85%, 0)`);
            ctx.fillStyle = grad;
            ctx.fill();
        }

        // Raio de apontamento: se estende a partir da ponta do indicador na direção da mão,
        // igual ao "pointer ray" do Quest 3 ao apontar para um elemento da UI
        function drawPointerRay(ctx, wristPt, tipPt, hue, alphaScale) {
            const dx = tipPt.x - wristPt.x, dy = tipPt.y - wristPt.y;
            const len = Math.hypot(dx, dy) || 1;
            const ux = dx / len, uy = dy / len;
            const rayLen = len * 2.6;
            const endX = tipPt.x + ux * rayLen, endY = tipPt.y + uy * rayLen;
            const grad = ctx.createLinearGradient(tipPt.x, tipPt.y, endX, endY);
            grad.addColorStop(0, `hsla(0, 0%, 100%, ${0.55 * alphaScale})`);
            grad.addColorStop(1, `hsla(0, 0%, 90%, 0)`);
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(tipPt.x, tipPt.y); ctx.lineTo(endX, endY); ctx.stroke();
        }

        // Renderiza uma mão completa: mesh + raio (só fora do modo de desempenho) + ossos + juntas
        function renderHandSkeleton(ctx, landmarks, hue, alphaScale, showExtras) {
            const pts = landmarks.map(lm => ({
                x: lm.x * skeletonCanvas.width,
                y: lm.y * skeletonCanvas.height,
                z: lm.z
            }));

            if (showExtras) drawPalmMesh(ctx, pts, hue, alphaScale);

            for (const [a, b] of HAND_BONES) {
                const depthAvg = (pts[a].z + pts[b].z) / 2;
                const a2 = alphaScale * Math.min(1.15, Math.max(0.55, 1 - depthAvg * 3));
                drawGlowBone(ctx, pts[a], pts[b], hue, a2);
            }
            pts.forEach((p, i) => {
                const isTip = FINGER_TIPS.includes(i);
                const a2 = alphaScale * Math.min(1.15, Math.max(0.55, 1 - p.z * 3));
                drawGlowJoint(ctx, p, isTip ? 4.2 : 2.6, hue, a2);
            });

            if (showExtras) drawPointerRay(ctx, pts[0], pts[8], hue, alphaScale);
            return pts;
        }

        // --- Reconhecimento de gestos ---
        function dist2D(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

        // Punho fechado: todos os dedos recolhidos abaixo das juntas médias
        function isFist(landmarks) {
            const tips = [8, 12, 16, 20];
            const pips = [6, 10, 14, 18];
            return tips.every((tipIdx, i) => landmarks[tipIdx].y > landmarks[pips[i]].y - 0.01);
        }

        // Mão aberta e espalmada: dedos esticados e afastados entre si (gesto do "menu de pulso")
        function isOpenPalm(landmarks) {
            const tips = [8, 12, 16, 20];
            const pips = [6, 10, 14, 18];
            const allExtended = tips.every((tipIdx, i) => landmarks[tipIdx].y < landmarks[pips[i]].y - 0.02);
            if (!allExtended) return false;
            const handSize = dist2D(landmarks[0], landmarks[9]) || 0.001;
            const spread = dist2D(landmarks[8], landmarks[20]) / handSize;
            return spread > 1.0;
        }

        handsEngine.onResults((results) => {
            skeletonCtx.clearRect(0, 0, skeletonCanvas.width, skeletonCanvas.height);
            if (!handTrackingActive) return;

            const now = performance.now();
            const seenThisFrame = new Set();

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                results.multiHandLandmarks.forEach((landmarks, i) => {
                    if (i > 1) return; // só rastreamos 2 slots visuais
                    const slot = handSlots[i];
                    const handednessLabel = results.multiHandedness?.[i]?.label || 'Right';
                    slot.handedness = handednessLabel;
                    seenThisFrame.add(i);
                    slot.lastSeen = now;

                    if (!slot.wasVisible) { slot.firstSeenAt = now; slot.wasVisible = true; }
                    const appearAlpha = Math.min(1, (now - slot.firstSeenAt) / 180);

                    // Renderiza o esqueleto com cor por mão (azul = direita, violeta = esquerda)
                    const hue = handednessLabel === 'Left' ? 275 : 208;
                    const showExtras = !performanceMode;
                    const pts = renderHandSkeleton(skeletonCtx, landmarks, hue, appearAlpha, showExtras);

                    const indexFinger = landmarks[8];
                    const thumb = landmarks[4];

                    // Filtro One Euro: suaviza sem o "delay" perceptível de uma média/lerp fixa
                    const targetX = indexFinger.x * window.innerWidth;
                    const targetY = indexFinger.y * window.innerHeight;
                    slot.smoothedX = slot.filterX.filter(targetX, now);
                    slot.smoothedY = slot.filterY.filter(targetY, now);

                    slot.el.classList.add('visible');
                    slot.el.classList.toggle('hand-left', handednessLabel === 'Left');
                    slot.el.style.left = `${slot.smoothedX}px`;
                    slot.el.style.top = `${slot.smoothedY}px`;

                    // Hover espacial: destaca o elemento sob o ponteiro antes de clicar (feedback tipo raycast)
                    const hoverEl = document.elementFromPoint(slot.smoothedX, slot.smoothedY);
                    const interactive = hoverEl && (hoverEl.tagName === 'BUTTON' || hoverEl.closest('.dock-item') || hoverEl.closest('.app-card') || hoverEl.closest('.launcher-popup-item') || hoverEl.closest('.filemgr-row'));
                    const newHoverTarget = interactive ? (hoverEl.closest('.dock-item, .app-card, .launcher-popup-item, .filemgr-row, button') || hoverEl) : null;
                    if (slot.hoverTarget !== newHoverTarget) {
                        if (slot.hoverTarget) slot.hoverTarget.classList.remove('spatial-hover');
                        if (newHoverTarget) newHoverTarget.classList.add('spatial-hover');
                        slot.hoverTarget = newHoverTarget;
                    }

                    // --- Gesto 1: pinça (polegar + indicador) = clique / arrastar fino em profundidade ---
                    const distance3D = Math.sqrt(
                        Math.pow(indexFinger.x - thumb.x, 2) +
                        Math.pow(indexFinger.y - thumb.y, 2) +
                        Math.pow(indexFinger.z - thumb.z, 2)
                    );

                    if (distance3D < pinchSensitivity) {
                        if (!slot.isPinching) {
                            slot.isPinching = true;
                            slot.el.classList.add('pinching');
                            slot.basePinchDepth = indexFinger.z;
                            executeSpatialClick(slot, slot.smoothedX, slot.smoothedY);
                        } else if (slot.windowBeingDragged) {
                            slot.windowBeingDragged.style.left = `${slot.smoothedX - slot.dragOffsetX}px`;
                            slot.windowBeingDragged.style.top = `${slot.smoothedY - slot.dragOffsetY}px`;
                            const deltaZ = (indexFinger.z - slot.basePinchDepth) * -900;
                            const finalZ = Math.min(Math.max(deltaZ, -zDepthLimit), zDepthLimit * 1.2);
                            slot.windowBeingDragged.dataset.zDepth = finalZ;
                            makeSpatial(slot.windowBeingDragged);
                        }
                    } else if (slot.isPinching) {
                        slot.isPinching = false;
                        slot.el.classList.remove('pinching');
                        slot.windowBeingDragged = null;
                    }

                    // --- Gesto 2: punho fechado sobre uma janela = "agarra" a janela inteira (reach & grab) ---
                    const fisted = isFist(landmarks);
                    if (!slot.isPinching) {
                        if (fisted && !slot.isGrabbing) {
                            const winEl = hoverEl && hoverEl.closest('.vr-window-container');
                            if (winEl) {
                                slot.isGrabbing = true;
                                slot.windowBeingDragged = winEl;
                                slot.dragOffsetX = slot.smoothedX - (parseInt(winEl.style.left) || 0);
                                slot.dragOffsetY = slot.smoothedY - (parseInt(winEl.style.top) || 0);
                                slot.basePinchDepth = indexFinger.z;
                                playUiSound(520);
                            }
                        } else if (slot.isGrabbing && fisted && slot.windowBeingDragged) {
                            slot.windowBeingDragged.style.left = `${slot.smoothedX - slot.dragOffsetX}px`;
                            slot.windowBeingDragged.style.top = `${slot.smoothedY - slot.dragOffsetY}px`;
                            const deltaZ = (indexFinger.z - slot.basePinchDepth) * -900;
                            const finalZ = Math.min(Math.max(deltaZ, -zDepthLimit), zDepthLimit * 1.2);
                            slot.windowBeingDragged.dataset.zDepth = finalZ;
                            makeSpatial(slot.windowBeingDragged);
                        } else if (slot.isGrabbing && !fisted) {
                            // Abrir a mão solta a janela — igual ao "release" de um objeto agarrado no Quest
                            slot.isGrabbing = false;
                            slot.windowBeingDragged = null;
                        }
                    }

                    // --- Gesto 3: mão aberta e espalmada = abre o menu rápido (menu de pulso, como no Quest) ---
                    const openPalm = isOpenPalm(landmarks);
                    if (openPalm && !slot.wasOpenPalm && !slot.isPinching && !slot.isGrabbing && (now - slot.lastPalmGestureAt) > PALM_GESTURE_COOLDOWN) {
                        slot.lastPalmGestureAt = now;
                        toggleLauncherPopup();
                        playUiSound(760);
                    }
                    slot.wasOpenPalm = openPalm;
                });
            }

            // Mãos que somem do frame só desaparecem após um pequeno timeout — evita "piscar" o ponteiro
            handSlots.forEach((slot, i) => {
                if (!seenThisFrame.has(i) && now - slot.lastSeen > HAND_LOST_TIMEOUT) {
                    resetHandSlot(slot);
                }
            });
        });

        function executeSpatialClick(slot, x, y) {
            const element = document.elementFromPoint(x, y);
            if (!element) return;

            if (element.tagName === 'BUTTON' || element.closest('.dock-item') || element.closest('.app-card') || element.closest('.launcher-popup-item') || element.closest('.filemgr-row')) {
                element.click();
                return;
            }

            const moveBar = element.closest('.window-move-bar');
            if (moveBar) {
                slot.windowBeingDragged = moveBar.closest('.vr-window-container');
                slot.dragOffsetX = x - parseInt(slot.windowBeingDragged.style.left);
                slot.dragOffsetY = y - parseInt(slot.windowBeingDragged.style.top);
            }
        }
    </script>
</body>
</html>
