            for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
            const blob = new Blob([bytes], { type: 'text/html;charset=utf-8' });
            advancedFilemgrBlobUrl = URL.createObjectURL(blob);
            return advancedFilemgrBlobUrl;
        }
        function buildAdvancedFileManagerHTML() {
            return `<div class="filemgr-advanced-wrap" style="position:relative; width:100%; height:100%;">
                <div class="filemgr-advanced-loading" style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; font-size:13px; opacity:.8; text-align:center; padding:20px; box-sizing:border-box;">
                    <span>Carregando gerenciador avançado…</span>
                </div>
                <iframe class="filemgr-advanced-frame" style="width:100%; height:100%; border:none;"
                    src="${getAdvancedFilemgrBlobUrl()}"
                    title="Gerenciador de Arquivos Avançado"></iframe>
            </div>`;
        }

        // Em alguns navegadores/PCs o iframe acima pode não carregar (ex.: bloqueio
        // de blob dentro de um arquivo aberto direto do disco). Se depois de alguns
        // segundos ele não avisar que carregou, mostramos um botão pra abrir em
        // aba separada, que costuma funcionar mesmo quando o iframe é bloqueado.
        function setupAdvancedFilemgrFallback(container) {
            const wrap = container.querySelector('.filemgr-advanced-wrap');
            if (!wrap) return;
            const loadingEl = wrap.querySelector('.filemgr-advanced-loading');
            const iframeEl = wrap.querySelector('.filemgr-advanced-frame');
            let loaded = false;
            if (iframeEl) {
                iframeEl.addEventListener('load', () => {
                    loaded = true;
                    if (loadingEl) loadingEl.style.display = 'none';
                });
            }
            setTimeout(() => {
                if (!loaded && loadingEl) {
                    loadingEl.innerHTML = `
                        <span>Não foi possível carregar aqui dentro (acontece em alguns navegadores no PC).</span>
                        <button class="settings-action-btn" onclick="window.open(getAdvancedFilemgrBlobUrl(), '_blank')">Abrir em nova aba</button>`;
                }
            }, 6000);
        }

        function openAdvancedFileManager() {
            createWindow('Gerenciador de Arquivos — Avançado', 'filemanager-advanced');
        }

        function filemgrSortArrow(col) {
            return filemgrState.sort === col ? '<span>▾</span>' : '';
        }

        function buildFileManagerHTML() {
            const totals = getFileManagerTotals();
            const trashCount = trashedApps.length + trashedFiles.length;
            const currentPlace = FILEMGR_PLACES.find(p => p.key === filemgrState.filter) || FILEMGR_PLACES[0];
            const crumbLabel = filemgrState.showTrash ? 'Lixeira' : currentPlace.label;
            const sidebarHTML = `
                <div class="filemgr-sidebar">
                    <div>
                        <div class="filemgr-sidebar-group-label">Locais</div>
                        ${FILEMGR_PLACES.map(p => `
                            <div class="filemgr-sidebar-item ${!filemgrState.showTrash && filemgrState.filter === p.key ? 'active' : ''}" onclick="filemgrSetFilter('${p.key}')">
                                <span class="si-ic">${p.icon}</span><span>${p.label}</span>
                            </div>`).join('')}
                        <div class="filemgr-sidebar-item ${filemgrState.showTrash ? 'active' : ''}" onclick="filemgrToggleTrashView(true)">
                            <span class="si-ic">🗑️</span><span>Lixeira${trashCount ? ` (${trashCount})` : ''}</span>
                        </div>
                    </div>
                    <div>
                        <div class="filemgr-sidebar-group-label">Mais</div>
                        <div class="filemgr-sidebar-item" onclick="openAdvancedFileManager()" title="Abre o gerenciador com pastas, IndexedDB, arrastar-e-soltar, editor, zip, lixeira própria e mais">
                            <span class="si-ic">🗂️</span><span>Avançado (Pastas)</span>
                        </div>
                    </div>
                </div>`;
            return `
                <div class="filemgr-wrap">
                    ${sidebarHTML}
                    <div class="filemgr-main">
                        <div class="filemgr-header">
                            <div class="filemgr-navrow">
                                <button class="filemgr-navbtn" disabled title="Voltar">◀</button>
                                <button class="filemgr-navbtn" disabled title="Avançar">▶</button>
                                <button class="filemgr-navbtn" onclick="filemgrGoHome()" title="Início">🏠</button>
                                <div class="filemgr-breadcrumb">🏠 Início <span>›</span> <b>${crumbLabel}</b></div>
                                <button class="filemgr-navbtn ${filemgrState.searchOpen ? 'active' : ''}" onclick="filemgrToggleSearch()" title="Buscar">🔎</button>
                                <span class="filemgr-count-badge">${filemgrState.showTrash ? `${trashCount} item(ns)` : `${totals.count} item(ns)`}</span>
                            </div>
                            <div class="filemgr-toolbar">
                                <div class="filemgr-toolbar-row">
                                    ${filemgrState.searchOpen ? `
                                    <div class="filemgr-search">
                                        <span>🔎</span>
                                        <input type="text" placeholder="Buscar por nome…" value="${escapeHtmlAttr(filemgrState.query)}" oninput="filemgrSetQuery(this.value)">
                                    </div>` : ''}
                                    <select class="filemgr-select" onchange="filemgrSetSort(this.value)" title="Ordenar">
                                        <option value="name" ${filemgrState.sort === 'name' ? 'selected' : ''}>Nome</option>
                                        <option value="size" ${filemgrState.sort === 'size' ? 'selected' : ''}>Tamanho</option>
                                        <option value="type" ${filemgrState.sort === 'type' ? 'selected' : ''}>Tipo</option>
                                    </select>
                                    <div class="filemgr-view-toggle">
                                        <button class="filemgr-icon-btn ${filemgrState.view === 'list' ? 'active' : ''}" onclick="filemgrSetView('list')" title="Lista">☰</button>
                                        <button class="filemgr-icon-btn ${filemgrState.view === 'grid' ? 'active' : ''}" onclick="filemgrSetView('grid')" title="Grade">▦</button>
                                    </div>
                                    <button class="filemgr-icon-btn ${filemgrState.selectMode ? 'active' : ''}" onclick="filemgrToggleSelectMode()" title="Selecionar vários">${filemgrState.selectMode ? '✕ Cancelar' : '☑️ Selecionar'}</button>
                                </div>
                                ${filemgrState.showTrash ? '' : `
                                <div class="filemgr-toolbar-row" style="justify-content:flex-end; width:100%;">
                                    <input type="file" class="filemgr-add-input" multiple style="display:none" onchange="addFilesToManager(this)">
                                    <button class="settings-action-btn" onclick="this.previousElementSibling.click()">➕ Adicionar arquivo</button>
                                    <input type="file" class="library-load-input" accept="application/json" style="display:none" onchange="loadAppsFromFile(this)">
                                    <button class="settings-action-btn" onclick="this.previousElementSibling.click()">⬆️ Importar apps</button>
                                    <button class="settings-action-btn" onclick="saveAppsToFile()">⬇️ Exportar apps</button>
                                    <input type="file" class="filemgr-backup-input" accept="application/json" style="display:none" onchange="importFullBackup(this)">
                                    <button class="settings-action-btn" onclick="this.previousElementSibling.click()">♻️ Restaurar backup</button>
                                    <button class="settings-action-btn" onclick="exportFullBackup()">💾 Backup completo</button>
                                </div>`}
                            </div>
                        </div>
                        ${filemgrPickerTarget ? `
                        <div class="filemgr-selbar" style="background:rgba(0,102,254,0.22); border-color:rgba(0,102,254,0.4);">
                            <span>📎 Escolha um arquivo pra enviar pro app que pediu.</span>
                            <button class="filemgr-icon-btn" onclick="filemgrPickerTarget=null; refreshLibraryPanels();">✕ Cancelar</button>
                        </div>` : ''}
                        ${filemgrState.selectMode && !filemgrState.showTrash ? `
                        <div class="filemgr-selbar">
                            <span>${filemgrState.selected.size} selecionado(s)</span>
                            <button class="filemgr-icon-btn" onclick="filemgrSelectAll()">Selecionar tudo</button>
                            <button class="filemgr-icon-btn danger" onclick="filemgrBulkDelete()" ${filemgrState.selected.size ? '' : 'disabled'}>🗑️ Apagar selecionados</button>
                        </div>` : ''}
                        ${filemgrState.showTrash && trashCount ? `
                        <div class="filemgr-selbar">
                            <span>Itens na lixeira são apagados de vez só quando você mandar.</span>
                            <button class="filemgr-icon-btn danger" onclick="emptyFileManagerTrash()">🗑️ Esvaziar lixeira</button>
                        </div>` : ''}
                        ${filemgrState.view === 'grid' ? '' : `
                        <div class="filemgr-colheader">
                            <div class="ch-icon-space"></div>
                            <div class="filemgr-col filemgr-col-name ${filemgrState.sort === 'name' ? 'active' : ''}" onclick="filemgrSetSort('name')">Nome ${filemgrSortArrow('name')}</div>
                            <div class="filemgr-col filemgr-col-size ${filemgrState.sort === 'size' ? 'active' : ''}" onclick="filemgrSetSort('size')">Tamanho ${filemgrSortArrow('size')}</div>
                            <div class="filemgr-col filemgr-col-type ${filemgrState.sort === 'type' ? 'active' : ''}" onclick="filemgrSetSort('type')">Tipo ${filemgrSortArrow('type')}</div>
                        </div>`}
                        <div class="filemgr-list ${filemgrState.view === 'grid' ? 'grid-view' : ''}"
                             ondragover="if(!${filemgrState.showTrash}){event.preventDefault(); this.classList.add('filemgr-dragover');}"
                             ondragleave="this.classList.remove('filemgr-dragover')"
                             ondrop="filemgrHandleDrop(event, this)"
                             oncontextmenu="event.preventDefault(); closeDockContextMenu();"
                        >${filemgrState.showTrash ? buildFileManagerTrashHTML() : buildFileManagerRowsHTML()}</div>
                        <div class="filemgr-status-bar">${filemgrState.showTrash ? `🗑️ ${trashCount} item(ns) na lixeira` : `${totals.count} item(ns) · ${formatBytes(totals.bytes)}${filemgrState.selectMode ? ` · ${filemgrState.selected.size} selecionado(s)` : ''}`}</div>
                    </div>
                </div>`;
        }

        // Aplica busca (por nome) + ordenação sobre uma lista de apps ou arquivos.
        // getName/getSize/getType extraem os campos certos de cada tipo de item.
        function filemgrFilterAndSort(list, getName, getSize, getType) {
            const q = filemgrState.query.trim().toLowerCase();
            let out = q ? list.filter(item => (getName(item) || '').toLowerCase().includes(q)) : list.slice();
            const sort = filemgrState.sort;
            out.sort((a, b) => {
                if (sort === 'size') return getSize(b) - getSize(a);
                if (sort === 'type') return (getType(a) || '').localeCompare(getType(b) || '') || (getName(a) || '').localeCompare(getName(b) || '');
                return (getName(a) || '').localeCompare(getName(b) || '', 'pt-BR');
            });
            return out;
        }

        // Ícone/emoji genérico pra representar o tipo de um arquivo cru (não-app)
        function fileTypeIcon(file) {
            const mime = file.mime || '';
            const name = file.name || '';
            if (mime.startsWith('image/')) return '🖼️';
            if (mime.startsWith('video/')) return '🎬';
            if (mime.startsWith('audio/')) return '🎵';
            if (mime === 'application/pdf') return '📕';
            if (/\.(zip|rar|7z|tar|gz)$/i.test(name)) return '🗜️';
            if (/\.(js|ts|json|css|html|py|java|c|cpp|jsx|tsx)$/i.test(name)) return '💻';
            if (mime.startsWith('text/') || /\.(txt|md|log|csv)$/i.test(name)) return '📄';
            return '📦';
        }

        // Um arquivo cru é considerado "de texto" quando dá pra ler e mostrar como texto plano
        function isPreviewableAsText(file) {
            return (file.mime || '').startsWith('text/')
                || /\.(txt|md|json|js|ts|jsx|tsx|css|html|csv|log|xml|yml|yaml)$/i.test(file.name || '');
        }

        // Um arquivo é considerado "HTML executável" quando o tipo/extensão indica isso —
        // usado pelo botão "▶️ Executar" (roda o arquivo de verdade, em vez de só mostrar o código-fonte)
        function isHtmlFile(file) {
            return (file.mime || '') === 'text/html' || /\.html?$/i.test(file.name || '');
        }

        function buildFileManagerRowsHTML() {
            const showApps = filemgrState.filter !== 'files';
            const showFiles = filemgrState.filter !== 'apps';
            const apps = showApps ? filemgrFilterAndSort(
                customApps.map((app, i) => ({ app, index: i })),
                x => x.app.name, x => getCustomAppSizeBytes(x.app), x => (x.app.url && !x.app.code) ? 'shortcut' : 'app'
            ) : [];
            const files = showFiles ? filemgrFilterAndSort(
                siteFiles.map((file, i) => ({ file, index: i })),
                x => x.file.name, x => x.file.size || 0, x => x.file.mime || ''
            ) : [];
            const searching = !!filemgrState.query.trim();
            const appsHTML = apps.length
                ? apps.map(x => buildAppFileRowHTML(x.app, x.index)).join('')
                : `<div class="filemgr-empty"><span class="filemgr-empty-icon">📱</span>${searching ? 'Nenhum app encontrado.' : 'Nenhum app criado ainda. Use a Fábrica de Apps.'}</div>`;
            const filesHTML = files.length
                ? files.map(x => buildGenericFileRowHTML(x.file, x.index)).join('')
                : `<div class="filemgr-empty"><span class="filemgr-empty-icon">🗂️</span>${searching ? 'Nenhum arquivo encontrado.' : 'Nenhum arquivo enviado ainda. Use "➕ Adicionar arquivo" pra enviar qualquer tipo (imagem, texto, PDF...).'}</div>`;
            const appsBlock = showApps ? `<div class="filemgr-section-label">📱 Apps (${apps.length}${searching ? `/${customApps.length}` : ''})</div>${appsHTML}` : '';
            const filesBlock = showFiles ? `<div class="filemgr-section-label">🗂️ Arquivos (${files.length}${searching ? `/${siteFiles.length}` : ''})</div>${filesHTML}` : '';
            return `${appsBlock}${filesBlock}`;
        }

        function filemgrItemClickAttr(kind, id, openCall) {
            // Em modo "escolher arquivo pra um app" (pedido de <input type="file"> de
            // dentro de um app), clicar num arquivo entrega ele pro app em vez de abrir.
            if (filemgrPickerTarget && kind === 'file') {
                const idx = siteFiles.findIndex(f => f.id === id);
                return `onclick="filemgrPickFileForTarget(${idx})"`;
            }
            // Em modo de seleção, clicar no item alterna a seleção em vez de abrir.
            return filemgrState.selectMode
                ? `onclick="filemgrToggleSelect('${kind}', ${id})"`
                : `onclick="${openCall}"`;
        }

        function buildAppFileRowHTML(app, index) {
            const label = app.name || 'sem-nome';
            const iconHTML = app.icon
                ? `<img src="${escapeHtmlAttr(app.icon)}" alt="" onerror="appIconErrorFallback(this, ${escapeHtmlAttr(JSON.stringify(label))})">`
                : (label ? label.charAt(0).toUpperCase() : '?');
            const isShortcut = !!(app.url && !app.code);
            const kind = isShortcut ? 'Atalho de Site' : 'App (.app)';
            const sizeBytes = getCustomAppSizeBytes(app);
            const selected = filemgrState.selected.has(`app:${app.id}`);
            const checkbox = filemgrState.selectMode ? `<div class="filemgr-checkbox">${selected ? '✓' : ''}</div>` : '';
            const actions = filemgrState.selectMode ? '' : `
                <div class="filemgr-actions" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()">
                    ${isShortcut ? '' : `<button class="filemgr-action-btn" onclick="editCustomApp(${index})" title="Editar código">✏️</button>`}
                    <button class="filemgr-action-btn" onclick="renameCustomAppPrompt(${index})" title="Renomear">🏷️</button>
                    <button class="filemgr-action-btn" onclick="downloadSingleApp(${index})" title="Baixar arquivo (.json)">⬇️</button>
                    <button class="filemgr-action-btn danger" onclick="deleteCustomApp(${index})" title="Apagar">🗑️</button>
                </div>`;
            if (filemgrState.view === 'grid') {
                return `
                <div class="filemgr-card ${selected ? 'selected' : ''}" ${filemgrItemClickAttr('app', app.id, `openCustomApp(${index})`)} oncontextmenu="openFilemgrItemMenu(event, 'app', ${index})" title="Abrir ${escapeHtmlAttr(label)}">
                    ${checkbox}
                    <div class="filemgr-icon">${iconHTML}</div>
                    <div class="filemgr-meta">
                        <span class="filemgr-name">${label}</span>
                        <span class="filemgr-sub">${kind} · ${formatBytes(sizeBytes)}</span>
                    </div>
                </div>`;
            }
            return `
            <div class="filemgr-row ${selected ? 'selected' : ''}" ${filemgrItemClickAttr('app', app.id, `openCustomApp(${index})`)} oncontextmenu="openFilemgrItemMenu(event, 'app', ${index})" title="Abrir ${escapeHtmlAttr(label)}">
                ${checkbox}
                <div class="filemgr-icon">${iconHTML}</div>
                <div class="filemgr-col-name"><span class="filemgr-name">${label}</span></div>
                <div class="filemgr-col-size">${formatBytes(sizeBytes)}</div>
                <div class="filemgr-col-type">${kind}</div>
                ${actions}
            </div>`;
        }

        function buildGenericFileRowHTML(file, index) {
            const label = file.name || 'sem-nome';
            const iconHTML = file.mime && file.mime.startsWith('image/')
                ? `<img src="${file.dataUrl}" alt="" onerror="appIconErrorFallback(this, ${escapeHtmlAttr(JSON.stringify(label))})">`
                : `<span>${fileTypeIcon(file)}</span>`;
            const selected = filemgrState.selected.has(`file:${file.id}`);
            const checkbox = filemgrState.selectMode ? `<div class="filemgr-checkbox">${selected ? '✓' : ''}</div>` : '';
            const actions = filemgrState.selectMode ? '' : `
                <div class="filemgr-actions" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()">
                    ${isHtmlFile(file) ? `<button class="filemgr-action-btn" onclick="runHtmlFile(${index})" title="Executar arquivo HTML">▶️</button>` : ''}
                    <button class="filemgr-action-btn" onclick="renameSiteFilePrompt(${index})" title="Renomear">🏷️</button>
                    <button class="filemgr-action-btn" onclick="downloadSiteFile(${index})" title="Baixar arquivo">⬇️</button>
                    <button class="filemgr-action-btn danger" onclick="deleteSiteFile(${index})" title="Apagar">🗑️</button>
                </div>`;
            if (filemgrState.view === 'grid') {
                return `
                <div class="filemgr-card ${selected ? 'selected' : ''}" ${filemgrItemClickAttr('file', file.id, `openSiteFile(${index})`)} oncontextmenu="openFilemgrItemMenu(event, 'file', ${index})" title="Abrir ${escapeHtmlAttr(label)}">
                    ${checkbox}
                    <div class="filemgr-icon">${iconHTML}</div>
                    <div class="filemgr-meta">
                        <span class="filemgr-name">${label}</span>
                        <span class="filemgr-sub">${file.mime || 'arquivo'} · ${formatBytes(file.size || 0)}</span>
                    </div>
                </div>`;
            }
            return `
            <div class="filemgr-row ${selected ? 'selected' : ''}" ${filemgrItemClickAttr('file', file.id, `openSiteFile(${index})`)} oncontextmenu="openFilemgrItemMenu(event, 'file', ${index})" title="Abrir ${escapeHtmlAttr(label)}">
                ${checkbox}
                <div class="filemgr-icon">${iconHTML}</div>
                <div class="filemgr-col-name"><span class="filemgr-name">${label}</span></div>
                <div class="filemgr-col-size">${formatBytes(file.size || 0)}</div>
                <div class="filemgr-col-type">${file.mime || 'arquivo'}</div>
                ${actions}
            </div>`;
        }

        // Lista da Lixeira: mesmos cartões visuais, mas com ações de Restaurar / Apagar de vez.
        function buildFileManagerTrashHTML() {
            if (!trashedApps.length && !trashedFiles.length) {
                return `<div class="filemgr-empty"><span class="filemgr-empty-icon">🗑️</span>A lixeira está vazia.</div>`;
            }
            const appsHTML = trashedApps.map((app, index) => {
                const label = app.name || 'sem-nome';
                const iconHTML = app.icon
                    ? `<img src="${escapeHtmlAttr(app.icon)}" alt="" onerror="appIconErrorFallback(this, ${escapeHtmlAttr(JSON.stringify(label))})">`
                    : (label ? label.charAt(0).toUpperCase() : '?');
                return `
                <div class="filemgr-row filemgr-row-plain">
                    <div class="filemgr-icon">${iconHTML}</div>
                    <div class="filemgr-meta">
                        <span class="filemgr-name">${label}</span>
                        <span class="filemgr-trash-meta">Apagado ${trashedAgo(app._deletedAt)}</span>
                    </div>
                    <div class="filemgr-actions">
                        <button class="filemgr-action-btn" onclick="restoreTrashedApp(${index})" title="Restaurar">↩️</button>
                        <button class="filemgr-action-btn danger" onclick="permanentlyDeleteTrashedApp(${index})" title="Apagar de vez">🗑️</button>
                    </div>
                </div>`;
            }).join('');
            const filesHTML = trashedFiles.map((file, index) => {
                const label = file.name || 'sem-nome';
                const iconHTML = file.mime && file.mime.startsWith('image/')
                    ? `<img src="${file.dataUrl}" alt="" onerror="appIconErrorFallback(this, ${escapeHtmlAttr(JSON.stringify(label))})">`
                    : `<span>${fileTypeIcon(file)}</span>`;
                return `
                <div class="filemgr-row filemgr-row-plain">
                    <div class="filemgr-icon">${iconHTML}</div>
                    <div class="filemgr-meta">
                        <span class="filemgr-name">${label}</span>
                        <span class="filemgr-trash-meta">Apagado ${trashedAgo(file._deletedAt)}</span>
                    </div>
                    <div class="filemgr-actions">
                        <button class="filemgr-action-btn" onclick="restoreTrashedFile(${index})" title="Restaurar">↩️</button>
                        <button class="filemgr-action-btn danger" onclick="permanentlyDeleteTrashedFile(${index})" title="Apagar de vez">🗑️</button>
                    </div>
                </div>`;
            }).join('');
            return `
                ${trashedApps.length ? `<div class="filemgr-section-label">📱 Apps (${trashedApps.length})</div>${appsHTML}` : ''}
                ${trashedFiles.length ? `<div class="filemgr-section-label">🗂️ Arquivos (${trashedFiles.length})</div>${filesHTML}` : ''}`;
        }

        function trashedAgo(ts) {
            if (!ts) return 'há pouco';
            const mins = Math.floor((Date.now() - ts) / 60000);
            if (mins < 1) return 'agora mesmo';
            if (mins < 60) return `há ${mins} min`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `há ${hours}h`;
            return `há ${Math.floor(hours / 24)}d`;
        }

        // --- Controles de busca / ordenação / visualização / seleção múltipla / lixeira ---
        function filemgrSetQuery(value) {
            filemgrState.query = value;
            refreshLibraryPanels();
            // devolve o foco pro campo de busca após o re-render (senão perde o foco a cada tecla)
            requestAnimationFrame(() => {
                const input = document.querySelector('.filemgr-search input');
                if (input) { input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
            });
        }

        function filemgrSetSort(value) {
            filemgrState.sort = value;
            refreshLibraryPanels();
        }

        function filemgrSetView(view) {
            filemgrState.view = view;
            refreshLibraryPanels();
        }

        // Seção clicada na barra lateral "Locais" (Tudo / Apps / Arquivos)
        function filemgrSetFilter(filter) {
            filemgrState.filter = filter;
            filemgrState.showTrash = false;
            filemgrState.selectMode = false;
            filemgrState.selected.clear();
            refreshLibraryPanels();
        }

        // Botão de lupa na toolbar: abre/fecha o campo de busca
        function filemgrToggleSearch() {
            filemgrState.searchOpen = !filemgrState.searchOpen;
            if (!filemgrState.searchOpen) filemgrState.query = '';
            refreshLibraryPanels();
            if (filemgrState.searchOpen) {
                requestAnimationFrame(() => {
                    const input = document.querySelector('.filemgr-search input');
                    if (input) input.focus();
                });
            }
        }

        // Botão "Início" na toolbar: volta pra visão padrão (Tudo, sem busca/lixeira)
        function filemgrGoHome() {
            filemgrState.filter = 'all';
            filemgrState.showTrash = false;
            filemgrState.searchOpen = false;
            filemgrState.query = '';
            filemgrState.selectMode = false;
            filemgrState.selected.clear();
            refreshLibraryPanels();
        }

        function filemgrToggleSelectMode() {
            filemgrState.selectMode = !filemgrState.selectMode;
            filemgrState.selected.clear();
            refreshLibraryPanels();
        }

        function filemgrToggleSelect(kind, id) {
            const key = `${kind}:${id}`;
            if (filemgrState.selected.has(key)) filemgrState.selected.delete(key);
            else filemgrState.selected.add(key);
            refreshLibraryPanels();
        }

        function filemgrSelectAll() {
            customApps.forEach(a => filemgrState.selected.add(`app:${a.id}`));
            siteFiles.forEach(f => filemgrState.selected.add(`file:${f.id}`));
            refreshLibraryPanels();
        }

        function filemgrToggleTrashView(forceShow) {
            filemgrState.showTrash = typeof forceShow === 'boolean' ? forceShow : !filemgrState.showTrash;
            filemgrState.selectMode = false;
            filemgrState.selected.clear();
            refreshLibraryPanels();
        }

        // Apaga (move pra lixeira) todos os itens marcados de uma vez.
        function filemgrBulkDelete() {
            if (!filemgrState.selected.size) return;
            const appIds = new Set(), fileIds = new Set();
            filemgrState.selected.forEach(key => {
                const [kind, id] = key.split(':');
                (kind === 'app' ? appIds : fileIds).add(Number(id));
            });
            const now = Date.now();
            const movedApps = [];
            customApps = customApps.filter(a => {
                if (appIds.has(a.id)) { a._deletedAt = now; trashedApps.unshift(a); movedApps.push(a); return false; }
                return true;
            });
            const movedFiles = [];
            siteFiles = siteFiles.filter(f => {
                if (fileIds.has(f.id)) { f._deletedAt = now; trashedFiles.unshift(f); movedFiles.push(f); return false; }
                return true;
            });
            dockShortcuts = dockShortcuts.filter(sc => !movedApps.some(a => a.id === sc.appId));
            renderDockShortcuts();
            const count = movedApps.length + movedFiles.length;
            filemgrState.selectMode = false;
            filemgrState.selected.clear();
            refreshLibraryPanels();
            playUiSound(220);
            filemgrToast(`${count} item(ns) movido(s) pra lixeira.`, () => {
                movedApps.forEach(a => { delete a._deletedAt; customApps.push(a); trashedApps = trashedApps.filter(x => x !== a); });
                movedFiles.forEach(f => { delete f._deletedAt; siteFiles.push(f); trashedFiles = trashedFiles.filter(x => x !== f); });
                refreshLibraryPanels();
            });
        }

        function restoreTrashedApp(index) {
            const app = trashedApps[index];
            if (!app) return;
            trashedApps.splice(index, 1);
            delete app._deletedAt;
            customApps.push(app);
            refreshLibraryPanels();
            playUiSound(660);
        }

        function restoreTrashedFile(index) {
            const file = trashedFiles[index];
            if (!file) return;
            trashedFiles.splice(index, 1);
            delete file._deletedAt;
            siteFiles.push(file);
            refreshLibraryPanels();
            playUiSound(660);
        }

        function permanentlyDeleteTrashedApp(index) {
            const app = trashedApps[index];
            if (!app) return;
            if (!confirm(`Apagar "${app.name}" de vez? Essa ação não pode ser desfeita.`)) return;
            trashedApps.splice(index, 1);
            refreshLibraryPanels();
            playUiSound(220);
        }

        function permanentlyDeleteTrashedFile(index) {
            const file = trashedFiles[index];
            if (!file) return;
            if (!confirm(`Apagar "${file.name}" de vez? Essa ação não pode ser desfeita.`)) return;
            trashedFiles.splice(index, 1);
            refreshLibraryPanels();
            playUiSound(220);
        }

        function emptyFileManagerTrash() {
            const count = trashedApps.length + trashedFiles.length;
            if (!count) return;
            if (!confirm(`Esvaziar a lixeira e apagar ${count} item(ns) de vez? Essa ação não pode ser desfeita.`)) return;
            trashedApps = [];
            trashedFiles = [];
            refreshLibraryPanels();
            playUiSound(220);
        }

        // Toast simples com opção de "Desfazer", usado pelas exclusões do Gerenciador de Arquivos.
        function filemgrToast(message, onUndo) {
            document.querySelectorAll('.filemgr-toast').forEach(t => t.remove());
            const wmSpaceEl = document.getElementById('wm-space') || document.body;
            const toast = document.createElement('div');
            toast.className = 'filemgr-toast';
            toast.innerHTML = `<span>${message}</span>${onUndo ? `<span class="filemgr-toast-undo">Desfazer</span>` : ''}`;
            if (onUndo) {
                toast.querySelector('.filemgr-toast-undo').onclick = () => { onUndo(); toast.remove(); };
            }
            wmSpaceEl.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        // Lê um ou mais arquivos escolhidos pelo usuário (de QUALQUER tipo) e
        // guarda em siteFiles como Data URL, pra poder pré-visualizar/baixar depois.
        function addFilesToManager(input) {
            addRawFilesToManager(input.files);
            input.value = '';
        }

        // Lê uma FileList (de um <input> ou de um drag-and-drop) e guarda cada
        // arquivo em siteFiles como Data URL, pra poder pré-visualizar/baixar depois.
        function addRawFilesToManager(fileList) {
            const files = Array.from(fileList || []);
            if (files.length === 0) return;
            let pending = files.length;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    siteFiles.push({
                        id: siteFileIdSeq++,
                        name: file.name,
                        mime: file.type || 'application/octet-stream',
                        size: file.size,
                        dataUrl: e.target.result
                    });
                    pending--;
                    if (pending === 0) {
                        refreshLibraryPanels();
                        playUiSound(880);
                    }
                };
                reader.onerror = () => {
                    pending--;
                    if (pending === 0) refreshLibraryPanels();
                };
                reader.readAsDataURL(file);
            });
        }

        // Soltar arquivos direto na lista do Gerenciador (arrastar do desktop) os
        // adiciona igual ao botão "➕ Adicionar arquivo".
        function filemgrHandleDrop(event, el) {
            event.preventDefault();
            el.classList.remove('filemgr-dragover');
            if (filemgrState.showTrash) return;
            const dtFiles = event.dataTransfer && event.dataTransfer.files;
            if (!dtFiles || !dtFiles.length) return;
            addRawFilesToManager(dtFiles);
        }

        // Abre um arquivo cru numa janela espacial, com pré-visualização adequada
        // ao tipo: imagem, vídeo, áudio, PDF ou texto. Tipos não suportados mostram
        // um aviso com opção de baixar.
        function openSiteFile(index) {
            const file = siteFiles[index];
            if (!file) return;

            const container = document.createElement('div');
            container.className = 'vr-window-container';

            const previewId = `fp-text-${file.id}`;
            let previewHTML;
            if (file.mime.startsWith('image/')) {
                previewHTML = `<div class="filepreview-wrap"><img class="filepreview-img" src="${file.dataUrl}" alt=""></div>`;
            } else if (file.mime.startsWith('video/')) {
                previewHTML = `<div class="filepreview-wrap"><video class="filepreview-media" src="${file.dataUrl}" controls autoplay></video></div>`;
            } else if (file.mime.startsWith('audio/')) {
                previewHTML = `<div class="filepreview-wrap"><audio class="filepreview-media" src="${file.dataUrl}" controls autoplay></audio></div>`;
            } else if (file.mime === 'application/pdf') {
                previewHTML = `<iframe class="filepreview-frame" src="${file.dataUrl}"></iframe>`;
            } else if (isPreviewableAsText(file)) {
                previewHTML = `
                    <div class="filepreview-text-wrap">
                        <div class="filepreview-toolbar">
                            <button class="settings-action-btn" onclick="saveTextFileEdits(${file.id}, '${previewId}')">💾 Salvar</button>
                            ${isHtmlFile(file) ? `<button class="settings-action-btn" onclick="runHtmlFile(${index})">▶️ Executar</button>` : ''}
                        </div>
                        <textarea class="filepreview-editor" id="${previewId}" spellcheck="false">Carregando…</textarea>
                    </div>`;
            } else {
                previewHTML = `
                    <div class="filepreview-unsupported">
                        <div class="filepreview-unsupported-icon">${fileTypeIcon(file)}</div>
                        <p>Pré-visualização não disponível para este tipo de arquivo.</p>
                        <button class="settings-action-btn" onclick="downloadSiteFile(${index})">⬇️ Baixar arquivo</button>
                    </div>`;
            }

            container.innerHTML = `
                <div class="vr-window-rotor">
                    <div class="vr-window">
                        ${buildWindowHeader(file.name)}
                        <div class="window-content">${previewHTML}</div>
                        <div class="resize-handle" onmousedown="startResize(event, this.closest('.vr-window-container'))"></div>
                    </div>
                    <div class="window-move-bar" onmousedown="startDrag(event, this.closest('.vr-window-container'))" onwheel="pushDepth(event, this)"></div>
                </div>`;
            finalizeWindow(container, 'file-preview');

            if (isPreviewableAsText(file)) {
                fetch(file.dataUrl)
                    .then(r => r.text())
                    .then(txt => {
                        const ta = container.querySelector(`#${previewId}`);
                        if (ta) ta.value = txt;
                    })
                    .catch(() => {
                        const ta = container.querySelector(`#${previewId}`);
                        if (ta) ta.value = 'Não foi possível ler o conteúdo deste arquivo.';
                    });
            }
        }

        // Converte texto de volta em Data URL (base64, com suporte a acentos/emoji)
        // pra sobrescrever o conteúdo de um arquivo guardado no Gerenciador.
        function textToDataUrl(text, mime) {
            const bytes = new TextEncoder().encode(text);
            let binary = '';
            bytes.forEach(b => { binary += String.fromCharCode(b); });
            return `data:${mime || 'text/plain'};base64,${btoa(binary)}`;
        }

        // Salva as edições feitas na caixa de texto de volta no arquivo (por ID, não por
        // índice, pra continuar funcionando certo mesmo se a lista tiver mudado nesse meio-tempo).
        function saveTextFileEdits(fileId, textareaId) {
            const file = siteFiles.find(f => f.id === fileId);
            const ta = document.getElementById(textareaId);
            if (!file || !ta) return;
            file.dataUrl = textToDataUrl(ta.value, file.mime || 'text/plain');
            file.size = new Blob([ta.value]).size;
            refreshLibraryPanels();
            playUiSound(880);
            filemgrToast(`"${file.name}" salvo.`);
        }

        // Renomeia um app, mantendo qualquer atalho dele na barra sincronizado
        function renameCustomAppPrompt(index) {
            const app = customApps[index];
            if (!app) return;
            const newName = prompt('Novo nome do arquivo:', app.name || '');
            if (newName === null) return;
            const trimmed = newName.trim();
            if (!trimmed) return;
            app.name = trimmed;
            dockShortcuts.forEach(sc => { if (sc.appId === app.id) sc.name = trimmed; });
            renderDockShortcuts();
            refreshLibraryPanels();
            playUiSound(660);
        }

        function renameSiteFilePrompt(index) {
            const file = siteFiles[index];
            if (!file) return;
            const newName = prompt('Novo nome do arquivo:', file.name || '');
            if (newName === null) return;
            const trimmed = newName.trim();
            if (!trimmed) return;
            file.name = trimmed;
            refreshLibraryPanels();
            playUiSound(660);
        }

        // Baixa um único app como .json, sem depender do "Exportar apps"
        function downloadSingleApp(index) {
            const app = customApps[index];
            if (!app) return;
            const dataStr = JSON.stringify(app, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${(app.name || 'app').replace(/[^a-z0-9\-_]+/gi, '_')}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            playUiSound(880);
        }

        // Baixa um arquivo cru com o nome/formato original (a partir do Data URL guardado)
        function downloadSiteFile(index) {
            const file = siteFiles[index];
            if (!file) return;
            const a = document.createElement('a');
            a.href = file.dataUrl;
            a.download = file.name || 'arquivo';
            document.body.appendChild(a);
            a.click();
            a.remove();
            playUiSound(880);
        }

        // Converte um Data URL (o formato em que os arquivos ficam guardados no
        // Gerenciador) de volta pro texto original — usado pra rodar um .html
        // via srcdoc (que é same-origin, ao contrário de um iframe com src="data:...",
        // que o navegador trata como origem isolada e bloqueia).
        function dataUrlToText(dataUrl) {
            const base64 = (dataUrl.split(',')[1] || '');
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }

        // Roda um arquivo .html guardado no Gerenciador de Arquivos como se fosse um app:
        // abre numa janela espacial de verdade, executando o HTML/CSS/JS num sandbox
        // same-origin (mesmo mecanismo dos Apps criados na Fábrica) — e já conectado
        // ao Gerenciador de Arquivos (downloads e "escolher arquivo" de dentro do HTML
        // passam a usar os arquivos do site, em vez do disco real).
        function runHtmlFile(index) {
            const file = siteFiles[index];
            if (!file || !isHtmlFile(file)) return;

            const container = document.createElement('div');
            container.className = 'vr-window-container';
            container.innerHTML = `
                <div class="vr-window-rotor">
                    <div class="vr-window">
                        ${buildWindowHeader(`▶️ ${file.name}`)}
                        <div class="window-content">
                            <iframe class="app-sandbox"></iframe>
                        </div>
                        <div class="resize-handle" onmousedown="startResize(event, this.closest('.vr-window-container'))"></div>
                    </div>
                    <div class="window-move-bar" onmousedown="startDrag(event, this.closest('.vr-window-container'))" onwheel="pushDepth(event, this)"></div>
                </div>`;
            const iframe = container.querySelector('.app-sandbox');
            iframe.addEventListener('load', () => {
                autoFitAppWindow(container, iframe);
                connectAppFrameToFileManager(iframe);
            }, { once: true });
            let html;
            try {
                html = dataUrlToText(file.dataUrl);
            } catch (err) {
                html = '<body style="font-family:sans-serif;padding:20px;color:#c33">Não foi possível ler este arquivo.</body>';
            }
            iframe.srcdoc = html;
            finalizeWindow(container, 'html-run');
            playUiSound(880);
        }

        // --- PONTE: conecta as janelas de Apps (Fábrica de Apps e arquivos .html
        // executados) ao Gerenciador de Arquivos do site. Como esses apps rodam em
        // iframe via srcdoc (same-origin com a página principal), dá pra "escutar"
        // o que acontece lá dentro:
        //  1) Quando o app tenta baixar algo (link com download, blob: ou data:), a
        //     gente intercepta e salva o arquivo direto no Gerenciador — em vez de ir
        //     pro disco real do usuário.
        //  2) Quando o app pede pra escolher um arquivo (<input type="file">), a gente
        //     abre o Gerenciador de Arquivos do site pra escolher entre os arquivos já
        //     guardados, em vez do seletor nativo do sistema operacional.
        // OBS: isso só funciona pra apps que rodam DENTRO do sistema (Fábrica de Apps,
        // arquivos .html executados). Sites externos reais abertos no app Navegador
        // ficam em outra origem por natureza do navegador, e nenhum site consegue
        // ler/alterar o que acontece dentro de um iframe de outra origem — nem este
        // sistema, nem nenhum outro. Downloads feitos DENTRO do Navegador continuam
        // indo pro disco real do dispositivo, como em qualquer navegador.
        function connectAppFrameToFileManager(iframe) {
            let doc;
            try { doc = iframe.contentDocument; } catch (err) { return; }
            if (!doc || doc.__osFileBridgeConnected) return;
            doc.__osFileBridgeConnected = true;

            doc.addEventListener('click', function (ev) {
                const link = ev.target.closest && ev.target.closest('a');
                if (link && (link.hasAttribute('download') || /^(blob:|data:)/i.test(link.href || ''))) {
                    ev.preventDefault();
                    ev.stopPropagation();
                    const name = link.getAttribute('download') || guessFileNameFromUrl(link.href) || 'arquivo';
                    saveFrameDownloadToFileManager(link.href, name);
                    return;
                }
                // Link com target="_blank" tentando abrir nova ABA do navegador real.
                // Como este iframe é same-origin (srcdoc), dá pra interceptar e abrir
                // uma NOVA JANELA dentro do próprio sistema (app Navegador), em vez de
                // deixar o navegador de verdade abrir uma aba.
                if (link && link.target === '_blank' && link.href) {
                    ev.preventDefault();
                    ev.stopPropagation();
                    createWindow('Navegador Web v3', 'browser', { url: link.href });
                    return;
                }
                const fileInput = ev.target.closest && ev.target.closest('input[type="file"]');
                if (fileInput) {
                    ev.preventDefault();
                    ev.stopPropagation();
                    openFileManagerPickerFor(fileInput);
                }
            }, true);

            // Mesma lógica pra quando o app chama window.open(url) via JS em vez de
            // um link <a target="_blank">.
            try {
                iframe.contentWindow.open = function (url) {
                    if (url) createWindow('Navegador Web v3', 'browser', { url });
                    return null;
                };
            } catch (err) { /* ignora se não der pra sobrescrever */ }
        }

        function guessFileNameFromUrl(url) {
            try {
                const clean = String(url).split('?')[0].split('#')[0];
                const last = clean.split('/').pop();
                return last && last.includes('.') ? last : null;
            } catch (err) { return null; }
        }

        // Salva algo que um App tentou baixar (blob:/data:) como um arquivo normal no
        // Gerenciador de Arquivos do site, em vez de mandar pro disco real do usuário.
        function saveFrameDownloadToFileManager(url, name) {
            fetch(url).then(r => r.blob()).then(blob => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    siteFiles.push({
                        id: siteFileIdSeq++,
                        name: name,
                        mime: blob.type || 'application/octet-stream',
                        size: blob.size,
                        dataUrl: e.target.result
                    });
                    refreshLibraryPanels();
                    playUiSound(880);
                    filemgrToast(`"${name}" salvo no Gerenciador de Arquivos (não foi pro seu PC).`);
                };
                reader.readAsDataURL(blob);
            }).catch(() => {
                filemgrToast('Não foi possível salvar esse download no Gerenciador de Arquivos.');
            });
        }

        // Guarda qual <input type="file"> (de dentro de que app) está esperando um
        // arquivo, pra quando o usuário escolher algo no Gerenciador de Arquivos.
        let filemgrPickerTarget = null;

        function openFileManagerPickerFor(inputEl) {
            filemgrPickerTarget = inputEl;
            filemgrState.showTrash = false;
            filemgrState.filter = 'files';
            filemgrState.selectMode = false;
            launchFromPopup('Gerenciador de Arquivos', 'filemanager');
            refreshLibraryPanels();
            filemgrToast('Escolha um arquivo pra enviar pro app (clique num arquivo da lista).');
        }

        // Quando em "modo escolher arquivo", clicar num arquivo do Gerenciador entrega
        // ele pro <input type="file"> que pediu, como se tivesse sido escolhido do disco.
        function filemgrPickFileForTarget(index) {
            const file = siteFiles[index];
            if (!file || !filemgrPickerTarget) return;
            fetch(file.dataUrl).then(r => r.blob()).then(blob => {
                const target = filemgrPickerTarget;
                filemgrPickerTarget = null;
                if (!target || !target.isConnected) return;
                try {
                    const realFile = new File([blob], file.name, { type: file.mime || blob.type });
                    const dt = new target.ownerDocument.defaultView.DataTransfer();
                    dt.items.add(realFile);
                    target.files = dt.files;
                    target.dispatchEvent(new Event('change', { bubbles: true }));
                    playUiSound(880);
                } catch (err) {
                    filemgrToast('Não foi possível enviar esse arquivo pro app.');
                }
            });
        }

        // --- MENU DE CONTEXTO (botão direito) DE UM ITEM DO GERENCIADOR DE ARQUIVOS:
        // reaproveita o mesmo elemento de menu usado pelos atalhos da barra/biblioteca. ---
        function openFilemgrItemMenu(e, kind, index) {
            e.preventDefault();
            e.stopPropagation();
            let menu = document.getElementById('dock-context-menu');
            if (!menu) {
                menu = document.createElement('div');
                menu.id = 'dock-context-menu';
                menu.className = 'dock-context-menu';
                document.body.appendChild(menu);
            }
            let items = '';
            if (kind === 'app') {
                const app = customApps[index];
                if (!app) return;
                const isShortcut = !!(app.url && !app.code);
                items = `
                    <button onclick="openCustomApp(${index}); closeDockContextMenu();">▶️ Abrir</button>
                    ${isShortcut ? '' : `<button onclick="editCustomApp(${index}); closeDockContextMenu();">✏️ Editar código</button>`}
                    <button onclick="renameCustomAppPrompt(${index}); closeDockContextMenu();">🏷️ Renomear</button>
                    <button onclick="duplicateCustomApp(${index}); closeDockContextMenu();">📄 Duplicar</button>
                    <button onclick="downloadSingleApp(${index}); closeDockContextMenu();">⬇️ Baixar (.json)</button>
                    <button onclick="deleteCustomApp(${index}); closeDockContextMenu();">🗑️ Apagar</button>`;
            } else {
                const file = siteFiles[index];
                if (!file) return;
                items = `
                    <button onclick="openSiteFile(${index}); closeDockContextMenu();">▶️ Abrir</button>
                    ${isHtmlFile(file) ? `<button onclick="runHtmlFile(${index}); closeDockContextMenu();">🚀 Executar HTML</button>` : ''}
                    <button onclick="renameSiteFilePrompt(${index}); closeDockContextMenu();">🏷️ Renomear</button>
                    <button onclick="duplicateSiteFile(${index}); closeDockContextMenu();">📄 Duplicar</button>
                    <button onclick="downloadSiteFile(${index}); closeDockContextMenu();">⬇️ Baixar</button>
                    <button onclick="deleteSiteFile(${index}); closeDockContextMenu();">🗑️ Apagar</button>`;
            }
            menu.innerHTML = `<div class="dcm-spatial">${items}</div>`;
            menu.style.left = `${e.clientX}px`;
            menu.style.top = `${e.clientY}px`;
            menu.style.display = 'block';
            spatializeFloatingPanel(menu, '.dcm-spatial');
            replayCssAnimation(menu);
        }

        // Gera um nome "X (cópia)" pra duplicatas, sem empilhar "(cópia) (cópia)" se
        // o item já for uma cópia de outra cópia.
        function nextCopyName(name) {
            const base = (name || 'sem-nome').trim();
            return /\(cópia\)$/i.test(base) ? `${base} 2` : `${base} (cópia)`;
        }

        function duplicateSiteFile(index) {
            const file = siteFiles[index];
            if (!file) return;
            siteFiles.splice(index + 1, 0, {
                id: siteFileIdSeq++,
                name: nextCopyName(file.name),
                mime: file.mime,
                size: file.size,
                dataUrl: file.dataUrl
            });
            refreshLibraryPanels();
            playUiSound(660);
        }

        function duplicateCustomApp(index) {
            const app = customApps[index];
            if (!app) return;
            const copy = { id: customAppIdSeq++, name: nextCopyName(app.name), icon: app.icon || '' };
            if (app.code !== undefined) copy.code = app.code;
            if (app.url !== undefined) copy.url = app.url;
            customApps.splice(index + 1, 0, copy);
            refreshLibraryPanels();
            playUiSound(660);
        }

        function deleteSiteFile(index) {
            const file = siteFiles[index];
            if (!file) return;
            siteFiles.splice(index, 1);
            file._deletedAt = Date.now();
            trashedFiles.unshift(file);
            refreshLibraryPanels();
            playUiSound(220);
            filemgrToast(`"${file.name}" movido pra lixeira.`, () => {
                delete file._deletedAt;
                trashedFiles = trashedFiles.filter(f => f !== file);
                siteFiles.push(file);
                refreshLibraryPanels();
            });
        }

        // --- MENU DE CONTEXTO (botão direito) DE UM APP NA BIBLIOTECA: Excluir / Adicionar atalho na barra ---
        function openAppCardMenu(e, index) {
            e.preventDefault();
            e.stopPropagation();
            let menu = document.getElementById('dock-context-menu');
            if (!menu) {
                menu = document.createElement('div');
                menu.id = 'dock-context-menu';
                menu.className = 'dock-context-menu';
                document.body.appendChild(menu);
            }
            menu.innerHTML = `<div class="dcm-spatial">
                <button onclick="editCustomApp(${index}); closeDockContextMenu();">✏️ Editar</button>
                <button onclick="pinAppToDock(${index}); closeDockContextMenu();">📌 Adicionar atalho na barra</button>
                <button onclick="deleteCustomApp(${index}); closeDockContextMenu();">🗑️ Excluir</button>
            </div>`;
            menu.style.left = `${e.clientX}px`;
            menu.style.top = `${e.clientY - menu.offsetHeight - 60}px`;
            menu.style.display = 'block';
            spatializeFloatingPanel(menu, '.dcm-spatial');
            replayCssAnimation(menu);
        }

        // Abre a Fábrica de Apps já preenchida com o nome/imagem/código do app,
        // pra editar um app que já existe (em vez de sempre criar um novo).
        function editCustomApp(index) {
            const app = customApps[index];
            if (!app) return;
            if (app.url && !app.code) {
                alert('Esse é um atalho de site e não tem código pra editar na Fábrica de Apps.');
                return;
            }
            createWindow(`Editar: ${app.name}`, 'factory', { editApp: app });
        }

        function pinAppToDock(appIndex) {
            const app = customApps[appIndex];
            if (!app) return;
            if (dockShortcuts.length >= dockShortcutLimit) {
                alert(`Limite de ${dockShortcutLimit} atalhos na barra atingido. Aumente o limite nas Configurações.`);
                return;
            }
            dockShortcuts.push({ id: dockShortcutIdSeq++, appId: app.id, name: app.name, icon: app.icon || '' });
            renderDockShortcuts();
            playUiSound(660);
        }

        // Desenha os atalhos fixados na barra, à esquerda da Biblioteca
        function renderDockShortcuts() {
            const slot = document.getElementById('dock-shortcuts-slot');
            if (!slot) return;
            slot.innerHTML = dockShortcuts.map(sc => {
                const app = findAppById(sc.appId);
                const label = app ? app.name : sc.name;
                const fallbackSpan = `<span style="color:#fff;font-weight:700;font-size:15px;">${label.charAt(0).toUpperCase()}</span>`;
                // Se o link da imagem for inválido/quebrado, onerror troca a imagem
                // pela inicial do nome (via dockIconErrorFallback) em vez de deixar a bolinha quebrada.
                const iconHTML = sc.icon
                    ? `<img src="${escapeHtmlAttr(sc.icon)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="dockIconErrorFallback(this, ${escapeHtmlAttr(JSON.stringify(label))})">`
                    : fallbackSpan;
                return `
                <div class="dock-item dock-shortcut" data-shortcut-id="${sc.id}" title="${label}"
                     onclick="launchDockShortcut(${sc.id})"
                     oncontextmenu="openDockShortcutMenu(event, ${sc.id})">
                    ${iconHTML}
                </div>`;
            }).join('');
        }

        // Acha um app da Biblioteca pelo ID único (independe da posição no array)
        function findAppById(appId) {
            return customApps.find(a => a.id === appId);
        }

        function launchDockShortcut(id) {
            if (dockMoveArmedId !== null) { tryCompleteMove(id); return; }
            const sc = dockShortcuts.find(s => s.id === id);
            const app = sc ? findAppById(sc.appId) : null;
            if (!sc || !app) { alert('Esse app não existe mais.'); return; }
            openCustomApp(customApps.indexOf(app));
        }

        // --- MENU DE CONTEXTO (botão direito) DE UM ATALHO: Mover / Remover ---
        let dockMoveArmedId = null;

        function openDockShortcutMenu(e, id) {
            e.preventDefault();
            e.stopPropagation();
            let menu = document.getElementById('dock-context-menu');
            if (!menu) {
                menu = document.createElement('div');
                menu.id = 'dock-context-menu';
                menu.className = 'dock-context-menu';
                document.body.appendChild(menu);
            }
            menu.innerHTML = `<div class="dcm-spatial">
                <button onclick="armMoveDockShortcut(${id})">↔️ Mover atalho</button>
                <button onclick="removeDockShortcut(${id})">🗑️ Remover atalho</button>
            </div>`;
            menu.style.left = `${e.clientX}px`;
            menu.style.top = `${e.clientY - menu.offsetHeight - 60}px`;
            menu.style.display = 'block';
            spatializeFloatingPanel(menu, '.dcm-spatial');
            replayCssAnimation(menu);
        }

        function closeDockContextMenu() {
            const menu = document.getElementById('dock-context-menu');
            if (menu) menu.style.display = 'none';
        }

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('dock-context-menu');
            if (menu && menu.style.display !== 'none' && !menu.contains(e.target)) closeDockContextMenu();
        });

        function removeDockShortcut(id) {
            closeDockContextMenu();
            const sc = dockShortcuts.find(s => s.id === id);
            const label = sc ? sc.name : 'este atalho';
            if (!confirm(`Remover o atalho "${label}" da barra?`)) return;
            dockShortcuts = dockShortcuts.filter(s => s.id !== id);
            if (dockMoveArmedId === id) dockMoveArmedId = null;
            renderDockShortcuts();
            playUiSound(220);
        }

        // "Mover": arma o modo de troca — clique no atalho de origem, depois no
        // atalho de destino, e as posições dos dois na barra são trocadas.
        function armMoveDockShortcut(id) {
            dockMoveArmedId = id;
            closeDockContextMenu();
            document.querySelectorAll('.dock-shortcut').forEach(el => {
                el.classList.toggle('move-armed', Number(el.dataset.shortcutId) === id);
            });
        }

        function tryCompleteMove(targetId) {
            if (dockMoveArmedId === null || dockMoveArmedId === targetId) return false;
            const fromIdx = dockShortcuts.findIndex(s => s.id === dockMoveArmedId);
            const toIdx = dockShortcuts.findIndex(s => s.id === targetId);
            if (fromIdx === -1 || toIdx === -1) return false;
            [dockShortcuts[fromIdx], dockShortcuts[toIdx]] = [dockShortcuts[toIdx], dockShortcuts[fromIdx]];
            dockMoveArmedId = null;
            renderDockShortcuts();
            playUiSound(880);
            return true;
        }

        // Re-renderiza o grid de apps em toda janela de Biblioteca ABERTA no
        // momento, e também a lista de todo Gerenciador de Arquivos aberto —
        // as duas janelas mostram os mesmos apps, só que em formatos diferentes.
        function refreshLibraryPanels() {
            document.querySelectorAll('.vr-window-container').forEach(c => {
                if (c.dataset.winType === 'library') {
                    const grid = c.querySelector('.app-grid');
                    if (grid) grid.innerHTML = buildAppGridItemsHTML();
                } else if (c.dataset.winType === 'filemanager') {
                    const contentEl = c.querySelector('.window-content');
                    if (contentEl) contentEl.innerHTML = buildFileManagerHTML();
                }
            });
        }

        function deleteCustomApp(index) {
            const app = customApps[index];
            if (!app) return;
            customApps.splice(index, 1);
            // Remove só os atalhos que apontavam pra ESSE app (pelo ID). Como os
            // atalhos guardam o ID do app, e não a posição dele na lista, os outros
            // atalhos continuam corretos automaticamente — não precisa reajustar índices.
            const hadShortcuts = dockShortcuts.some(sc => sc.appId === app.id);
            dockShortcuts = dockShortcuts.filter(sc => sc.appId !== app.id);
            renderDockShortcuts();
            app._deletedAt = Date.now();
            trashedApps.unshift(app);
            playUiSound(220);
            refreshLibraryPanels();
            filemgrToast(`"${app.name}" movido pra lixeira.${hadShortcuts ? ' (atalho na barra removido)' : ''}`, () => {
                delete app._deletedAt;
                trashedApps = trashedApps.filter(a => a !== app);
                customApps.push(app);
                refreshLibraryPanels();
            });
        }

        // --- Carregar/Salvar apps como arquivo .json (fora do navegador, sem depender de armazenamento local) ---
        function toggleLibraryIOPanel(btn) {
            const wrap = btn.closest('.library-wrap');
            const panel = wrap.querySelector('.library-io-panel');
            const opening = !panel.classList.contains('open');
            panel.classList.toggle('open');
            playUiSound(opening ? 600 : 400);
        }

        function saveAppsToFile() {
            const dataStr = JSON.stringify(customApps, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `quest-os-apps-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            playUiSound(880);
        }

        function loadAppsFromFile(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (!Array.isArray(parsed)) throw new Error('o arquivo precisa conter uma lista de apps');
                    const valid = parsed
                        .filter(a => a && typeof a.name === 'string' && typeof a.code === 'string')
                        // Sempre gera um ID novo pra cada app importado — nunca reaproveita o ID
                        // que veio no arquivo, pra não colidir com IDs já usados nesta sessão
                        // (por exemplo, se o mesmo .json for importado mais de uma vez).
                        .map(a => ({ ...a, id: customAppIdSeq++ }));
                    if (valid.length === 0) throw new Error('nenhum app válido encontrado no arquivo');
                    customApps = customApps.concat(valid);
                    refreshLibraryPanels();
                            playUiSound(880);
                    alert(`${valid.length} app(s) carregado(s) com sucesso!`);
                } catch (err) {
                    alert('Erro ao carregar o arquivo: ' + err.message);
                }
            };
            reader.readAsText(file);
            input.value = '';
        }


        // --- BACKUP COMPLETO: exporta/restaura TUDO do Gerenciador de Arquivos de uma vez
        // (apps, arquivos crus e as duas lixeiras), diferente do "Exportar apps" que só
        // salva a Biblioteca de Apps. Inspirado no botão de backup do app "Arquivos". ---
        function exportFullBackup() {
            const payload = {
                kind: 'quest-os-full-backup',
                version: 1,
                exportedAt: new Date().toISOString(),
                customApps, siteFiles, trashedApps, trashedFiles
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup-arquivos-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            playUiSound(880);
        }

        function importFullBackup(input) {
            const file = input.files && input.files[0];
            if (!file) { return; }
            if (!confirm('Restaurar este backup vai SUBSTITUIR todos os apps, arquivos e a lixeira atuais. Continuar?')) {
                input.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    customApps = Array.isArray(data.customApps) ? data.customApps : [];
                    siteFiles = Array.isArray(data.siteFiles) ? data.siteFiles : [];
                    trashedApps = Array.isArray(data.trashedApps) ? data.trashedApps : [];
                    trashedFiles = Array.isArray(data.trashedFiles) ? data.trashedFiles : [];
                    customAppIdSeq = 1 + customApps.concat(trashedApps).reduce((m, a) => Math.max(m, a.id || 0), 0);
                    siteFileIdSeq = 1 + siteFiles.concat(trashedFiles).reduce((m, f) => Math.max(m, f.id || 0), 0);
                    dockShortcuts = dockShortcuts.filter(sc => customApps.some(a => a.id === sc.appId));
                    refreshLibraryPanels();
                    renderDockShortcuts();
                    playUiSound(880);
                    alert('Backup restaurado com sucesso!');
                } catch (err) {
                    alert('Erro ao restaurar o backup: ' + err.message);
                }
            };
            reader.readAsText(file);
            input.value = '';
        }


        // uma tag (ex: dentro de <textarea>...</textarea>), diferente de escapeHtmlAttr
        // que é pra dentro de atributos entre aspas.
        function escapeHtmlText(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function openCustomApp(index) {
            const app = customApps[index];
            // Atalho de site (criado com "Adicionar atalho de site"): guarda o
            // endereço em app.url e não tem app.code. Antes isso sempre caía no
            // srcdoc com app.code vazio, então a janela abria mas ficava em
            // branco. Um atalho de site precisa carregar de verdade via src=.
            const isSiteShortcut = !!(app.url && !app.code);
            const container = document.createElement('div');
            container.className = 'vr-window-container';
            container.dataset.appId = app.id; // permite achar essa janela depois se o app for editado
            container.innerHTML = `
                <div class="vr-window-rotor">
                    <div class="vr-window">
                        ${buildWindowHeader(app.name)}
                        <div class="window-content">
                            ${isSiteShortcut
                                ? `<iframe class="app-sandbox" src="${escapeHtmlAttr(app.url)}"></iframe>`
                                : `<iframe class="app-sandbox" srcdoc="${(app.code || '').replace(/"/g, '&quot;')}"></iframe>`}
                        </div>
                        <div class="resize-handle" onmousedown="startResize(event, this.closest('.vr-window-container'))"></div>
                    </div>
                    <div class="window-move-bar" onmousedown="startDrag(event, this.closest('.vr-window-container'))" onwheel="pushDepth(event, this)"></div>
                </div>
            `;
            // Assim que o app carregar, ajusta a janela pro tamanho do conteúdo
            // dele (em vez de sempre abrir no tamanho padrão, deixando espaço
            // vazio sobrando ou cortando o que não coube).
            const iframe = container.querySelector('.app-sandbox');
            iframe.addEventListener('load', () => {
                // Atalho de site é de outra origem: não dá pra ler o conteúdo dele
                // (autoFitAppWindow/connectAppFrameToFileManager acessam
                // iframe.contentDocument, o que o navegador bloqueia entre
                // origens diferentes), então isso só roda pra apps de código.
                if (!isSiteShortcut) {
                    autoFitAppWindow(container, iframe);
                    connectAppFrameToFileManager(iframe);
                }
            }, { once: true });
            finalizeWindow(container, 'app');
        }

        // Mede o conteúdo real do app (srcdoc é same-origin, então dá pra ler o
        // documento de dentro do iframe) e redimensiona a janela pra caber nele,
        // respeitando um mínimo/máximo razoável em relação ao tamanho da tela.
        function autoFitAppWindow(container, iframe) {
            try {
                const doc = iframe.contentDocument;
                if (!doc || !doc.body) return;
                const header = container.querySelector('.window-header');
                const headerH = header ? header.offsetHeight : 50;
                const contentW = Math.max(doc.documentElement.scrollWidth, doc.body.scrollWidth);
                const contentH = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
                if (!contentW || !contentH) return;

                const minW = 350, minH = 250;
                const maxW = Math.round(window.innerWidth * 0.85);
                const maxH = Math.round(window.innerHeight * 0.8);

                const targetW = Math.min(Math.max(contentW, minW), maxW);
                const targetH = Math.min(Math.max(contentH + headerH, minH), maxH);

                const windowEl = container.querySelector('.vr-window');
                windowEl.style.width = `${targetW}px`;
                windowEl.style.height = `${targetH}px`;
                makeSpatial(container);
            } catch (err) {
                // Se o conteúdo não puder ser lido por algum motivo, mantém o tamanho padrão
            }
        }

        function saveCustomApp(btn) {
            const factoryContainer = btn.closest('.factory-container');
            const name = factoryContainer.querySelector('.factory-input').value || "App Customizado";
            const code = factoryContainer.querySelector('.factory-code').value || "<body>Vazio</body>";
            const icon = factoryContainer.querySelector('.factory-cover-url').value.trim();
            const editingId = factoryContainer.dataset.editingAppId ? Number(factoryContainer.dataset.editingAppId) : null;

            if (editingId !== null) {
                // Modo edição: atualiza o app existente (mesmo ID) em vez de criar um novo
                const app = findAppById(editingId);
                if (app) {
                    app.name = name;
                    app.code = code;
                    app.icon = icon;
                    refreshLibraryPanels();
                    renderDockShortcuts();       // reflete nome/ícone novos nos atalhos fixados, se houver
                    refreshOpenAppWindows(editingId); // recarrega ao vivo qualquer janela desse app já aberta
                    playUiSound(880);
                    alert('App atualizado! As janelas abertas desse app já foram atualizadas.');
                    return;
                }
            }

            customApps.push({ id: customAppIdSeq++, name, code, icon });
            refreshLibraryPanels();
            playUiSound(880);
            alert('App compilado! Acesse a Biblioteca de Apps.');
        }

        // Recarrega ao vivo qualquer janela de app já aberta que esteja rodando o
        // app com esse ID — troca o conteúdo (código), o título e reajusta o
        // tamanho da janela, tudo na hora, sem precisar fechar/reabrir a janela.
        function refreshOpenAppWindows(appId) {
            const app = findAppById(appId);
            if (!app) return;
            document.querySelectorAll('.vr-window-container[data-win-type="app"]').forEach(container => {
                if (Number(container.dataset.appId) !== appId) return;
                const iframe = container.querySelector('.app-sandbox');
                if (iframe) {
                    iframe.addEventListener('load', () => {
                        autoFitAppWindow(container, iframe);
                        connectAppFrameToFileManager(iframe);
                    }, { once: true });
                    iframe.srcdoc = app.code || '<body>Vazio</body>';
                }
                const titleEl = container.querySelector('.window-title');
                if (titleEl) titleEl.textContent = app.name;
                // Mesmo "flash" visual usado na Auto-Atualização, pra indicar que atualizou
                const contentEl = container.querySelector('.window-content');
                if (contentEl) {
                    contentEl.classList.remove('refresh-flash');
                    void contentEl.offsetWidth; // força reflow pra reiniciar a animação
                    contentEl.classList.add('refresh-flash');
                }
            });
        }

        // --- TESTAR APP: alterna entre o editor de código e um preview ao vivo (iframe) ---
        function testCustomApp(btn) {
            const factoryContainer = btn.closest('.factory-container');
            const area = factoryContainer.querySelector('.factory-editor-area');
            const isTesting = area.classList.toggle('testing');
            if (isTesting) {
                const code = factoryContainer.querySelector('.factory-code').value || '<body>Vazio</body>';
                factoryContainer.querySelector('.factory-test-frame').srcdoc = code;
                btn.textContent = '✏️ Editar';
                btn.title = 'Voltar para o editor de código';
            } else {
                btn.textContent = '▶️ Testar';
                btn.title = 'Testar o app antes de compilar';
            }
            playUiSound(isTesting ? 700 : 500);
        }

        // --- INSERIR IMAGEM: converte a imagem escolhida em base64 e injeta uma tag <img> no código ---
        function triggerImageUpload(btn) {
            const factoryContainer = btn.closest('.factory-container');
            factoryContainer.querySelector('.factory-image-input').click();
        }

        function insertImageIntoCode(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const factoryContainer = input.closest('.factory-container');
            const textarea = factoryContainer.querySelector('.factory-code');
            const reader = new FileReader();
            reader.onload = (e) => {
                const dataUrl = e.target.result;
                const imgTag = `<img src="${dataUrl}" style="max-width:100%; border-radius:8px;">`;
                const start = textarea.selectionStart ?? textarea.value.length;
                const end = textarea.selectionEnd ?? textarea.value.length;
                textarea.value = textarea.value.slice(0, start) + imgTag + textarea.value.slice(end);
                textarea.focus();
                textarea.selectionStart = textarea.selectionEnd = start + imgTag.length;
                playUiSound(600);
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        // ===== NAVEGADOR: histórico (voltar/avançar), menu "...", zoom, traduzir, inspecionar =====
        // Cada aba guarda { urls: [...], index: N } — "index" aponta pra página atual.
        // Voltar/avançar só movem o ponteiro; navegar pra um link novo corta o que
        // ficou "à frente" (igual ao comportamento de qualquer navegador normal).
        const browserHistories = new WeakMap(); // .browser-container -> { urls, index }

        function initBrowserHistory(wrap, startUrl) {
            if (!wrap) return;
            browserHistories.set(wrap, { urls: [startUrl], index: 0 });
        }

        function updateBrowserNavButtons(wrap) {
