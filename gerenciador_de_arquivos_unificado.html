<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Quest 3S - Spatial 3D OS Simulator</title>
    <style>
        * {
            box-style: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #040408;
            /* Ativa o motor de perspectiva 3D global do navegador */
            perspective: 1400px;
            perspective-origin: 50% 50%;
        }

        #passthrough {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            /* Câmera traseira (passthrough real) não é espelhada, ao contrário da selfie */
        }

        #hand-skeleton-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            pointer-events: none;
        }

        .no-camera-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #141226 0%, #05040a 100%);
            z-index: 0;
        }

        /* Espaço de Trabalho Virtual com suporte a 3D nativo */
        #wm-space {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* Contêiner da Janela Espacial: só posicionamento (left/top), sem transform próprio */
        .vr-window-container {
            position: absolute;
            pointer-events: auto;
        }

        /* Camada que recebe a curvatura espacial (via JS, em makeSpatial()).
           IMPORTANTE — por que isso NÃO usa rotateY/translateZ com perspective/preserve-3d:
           testei e confirmei que é um bug real do Chromium: quando um elemento tem transform
           3D verdadeiro (rotateY) dentro de um contexto com perspective/preserve-3d, os
           cliques em FILHOS dele (botões, resize handle) são detectados no elemento pai
           errado, mesmo que visualmente o botão esteja renderizado no lugar certo. É por
           isso que a versão anterior desativava a curvatura por padrão.
           A solução real é simular a curvatura com transforms 2D puros (scaleX + skewY),
           que dão a mesma sensação de "painel espacial inclinado" mas continuam sendo
           hit-testados corretamente pelo navegador — cliques 100% confiáveis mesmo com
           a janela bem na borda da tela. Também mantém o vidro (backdrop-filter) numa
           camada separada de baixo, sem overflow:hidden aqui, o que evita o flicker visual
           que aparecia contra a câmera (passthrough) quando a janela se movia. */
        .vr-window-rotor {
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
            transition: transform 0.12s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Design de Vidro Espacial (Glassmorphism Avançado) */
        .vr-window {
            width: 650px;
            height: 450px;
            min-width: 350px;
            min-height: 250px;
            background: rgba(15, 15, 25, 0.45);
            backdrop-filter: blur(35px) saturate(160%);
            -webkit-backdrop-filter: blur(35px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            /* Sombra volumétrica que aumenta a percepção de flutuação */
            box-shadow: 0 50px 100px rgba(0,0,0,0.85), 
                        inset 0 1px 3px rgba(255,255,255,0.5),
                        0 0 30px rgba(0, 102, 254, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            isolation: isolate;
        }

        .window-header {
            padding: 16px 24px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.02));
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            cursor: grab;
        }
        .window-header:active { cursor: grabbing; }

        /* Melhoria visual: brilho superior sutil + realce na borda quando a
           janela está em foco (maior z-index = última clicada) */
        .vr-window { transition: box-shadow 0.25s, border-color 0.25s; }
        .vr-window-container.minimized .win-min { background-color: #34d058; }

        .win-btn { transition: transform 0.15s, filter 0.15s; }
        .win-btn:hover { transform: scale(1.25); filter: brightness(1.25); }
        .win-close:hover { box-shadow: 0 0 8px #ff5f56; }
        .win-min:hover { box-shadow: 0 0 8px #ffbd2e; }

        /* Alça de redimensionamento real no canto da janela */
        .resize-handle {
            position: absolute;
            width: 22px;
            height: 22px;
            right: 2px;
            bottom: 2px;
            cursor: nwse-resize;
            z-index: 5;
            background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.35) 50%, rgba(255,255,255,0.35) 60%, transparent 60%, transparent 70%, rgba(255,255,255,0.35) 70%, rgba(255,255,255,0.35) 80%, transparent 80%);
        }

        .vr-window-container.minimized .vr-window { height: auto !important; }
        .vr-window-container.minimized .window-content,
        .vr-window-container.minimized .resize-handle { display: none; }

        .window-title {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .window-controls {
            display: flex;
            gap: 12px;
        }

        .win-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }
        .win-close { background-color: #ff5f56; }
        .win-min { background-color: #ffbd2e; }

        /* Botões de giro manual: um pra cada "lado" (horizontal / vertical).
           Mesmo estilo de botão de janela, só que retangular e com um ícone,
           pra caber a seta de direção. Fica "aceso" (armed) enquanto ativo —
           nesse estado o scroll do mouse ou as setas do teclado giram a janela. */
        .win-rotate {
            width: 20px;
            height: 14px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            font-size: 9px;
            line-height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .win-rotate:hover { background: rgba(0, 102, 254, 0.4); }
        .win-rotate.armed {
            background: #0066fe;
            box-shadow: 0 0 10px #0066fe, 0 0 2px #fff;
        }

        /* Botão de Plana/Curva por janela: alterna se ESSA janela específica
           obedece a curvatura espacial automática ou fica sempre chata/plana,
           independente da configuração global. */
        .win-flat {
            width: 20px;
            height: 14px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            font-size: 9px;
            line-height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .win-flat:hover { background: rgba(0, 102, 254, 0.4); }
        .win-flat.flat-active {
            background: #ffb020;
            box-shadow: 0 0 10px #ffb020, 0 0 2px #fff;
        }

        /* Botão de Ancoragem Espacial (📍): fixa a janela num ponto no "ar" —
           enquanto ancorada, ela para de responder à pinça/rodinha manual e
           passa a reagir aos seus passos reais (acelerômetro) e à direção
           pra onde o celular aponta (giroscópio/bússola): andar na direção
           que a janela foi ancorada empurra ela "pra perto" (zDepth sobe),
           virar de costas e andar puxa ela "pra longe" (zDepth desce). */
        .win-anchor {
            width: 20px;
            height: 14px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            font-size: 9px;
            line-height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .win-anchor:hover { background: rgba(0, 102, 254, 0.4); }
        .win-anchor.anchor-active {
            background: #34d058;
            box-shadow: 0 0 10px #34d058, 0 0 2px #fff;
            animation: anchorPulse 2.2s ease-in-out infinite;
        }
        @keyframes anchorPulse {
            0%, 100% { box-shadow: 0 0 10px #34d058, 0 0 2px #fff; }
            50% { box-shadow: 0 0 4px #34d058, 0 0 1px #fff; }
        }

        /* Selo pequeno no topo da tela avisando que o modo de ancoragem
           espacial (sensores de movimento) está ativo e contando passos. */
        #walk-anchor-badge {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(15, 15, 25, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(52, 208, 88, 0.55);
            border-radius: 999px;
            padding: 7px 16px;
            font-size: 11px;
            letter-spacing: 0.4px;
            color: #fff;
            box-shadow: 0 0 20px rgba(52, 208, 88, 0.25);
            pointer-events: none;
        }
        #walk-anchor-badge .dot {
            width: 7px; height: 7px; border-radius: 50%; background: #34d058;
            box-shadow: 0 0 8px #34d058;
            animation: anchorPulse 1.4s ease-in-out infinite;
        }

        /* Botão de Auto-Atualização por janela: quando "armado", a janela
           refaz seu conteúdo periodicamente no intervalo definido nas
           Configurações. Pulsa suavemente pra indicar que está ativo. */
        .win-auto {
            width: 20px;
            height: 14px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            font-size: 9px;
            line-height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .win-auto:hover { background: rgba(0, 102, 254, 0.4); }
        .win-auto.auto-active {
            background: #28c76f;
            box-shadow: 0 0 10px #28c76f, 0 0 2px #fff;
            animation: autoPulse 1.6s ease-in-out infinite;
        }
        @keyframes autoPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        /* Botão de Tela Cheia: expande a janela pra ocupar todo o espaço
           de trabalho, sem curvatura/rotação, guardando a posição e o
           tamanho anteriores pra poder restaurar ao clicar de novo. */
        .win-max {
            width: 20px;
            height: 14px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            font-size: 9px;
            line-height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .win-max:hover { background: rgba(0, 102, 254, 0.4); }
        .win-max.max-active {
            background: #0066fe;
            box-shadow: 0 0 10px #0066fe, 0 0 2px #fff;
        }

        /* Estado maximizado: a janela cobre todo o #wm-space, sem cantos
           arredondados e sem alça de redimensionar/barra de mover, já que
           não faz sentido redimensionar ou arrastar em tela cheia. */
        .vr-window-container.maximized {
            left: 0 !important;
            top: 0 !important;
            z-index: 9999 !important;
        }
        .vr-window-container.maximized .vr-window-rotor { transform: none !important; }
        .vr-window-container.maximized .vr-window {
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
        }
        .vr-window-container.maximized .resize-handle,
        .vr-window-container.maximized .window-move-bar { display: none; }

        /* Em tela cheia o cabeçalho some sozinho, deixando o conteúdo
           ocupar 100% da janela. Ele "flutua" por cima do conteúdo e só
           reaparece quando o mouse encosta no topo da tela (ou toque),
           igual a um fullscreen de vídeo/jogo. Sair também pode ser feito
           com a tecla Esc. */
        .vr-window-container.maximized .window-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            cursor: default;
            transform: translateY(-100%);
            transition: transform 0.2s ease;
            z-index: 20;
            background: rgba(8, 8, 16, 0.92);
            border-radius: 0;
        }
        .vr-window-container.maximized.header-visible .window-header {
            transform: translateY(0);
        }
        /* Faixa sensível no topo pra detectar o mouse mesmo com o header escondido */
        .vr-window-container.maximized .fullscreen-hover-zone {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 12px;
            z-index: 19;
        }

        /* Piscada rápida no conteúdo quando a auto-atualização dispara,
           pra dar feedback visual de que a janela realmente atualizou. */
        .window-content.refresh-flash { animation: refreshFlash 0.5s ease; }
        @keyframes refreshFlash {
            0% { background: rgba(40, 199, 111, 0.18); }
            100% { background: rgba(5, 5, 10, 0.2); }
        }

        /* Entrada suave das janelas ao serem criadas */
        .vr-window-container.window-entering .vr-window-rotor {
            animation: windowSpawn var(--anim-speed, 0.35s) cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes windowSpawn {
            0% { opacity: 0; transform: scale(0.85) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Grade espacial de fundo (decorativa, ativável nas Configurações) */
        #spatial-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            background-image:
                linear-gradient(rgba(0, 102, 254, 0.18) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 102, 254, 0.18) 1px, transparent 1px);
            background-size: 48px 48px;
            transition: opacity 0.4s;
        }
        #spatial-grid.grid-visible { opacity: 1; }

        .window-content {
            flex: 1;
            color: #fff;
            overflow: auto;
            position: relative;
            background: rgba(5, 5, 10, 0.2);
        }

        /* Apps (iframe com o app do usuário) e Navegador já preenchem 100% da área
           via iframe — não precisam de barra de rolagem própria no window-content,
           então ela fica desligada aqui pra não sobrar espaço nem aparecer scroll duplo. */
        .vr-window-container[data-win-type="app"] .window-content,
        .vr-window-container[data-win-type="browser"] .window-content,
        .vr-window-container[data-win-type="filemanager-advanced"] .window-content {
            overflow: hidden;
        }

        /* Iframe do Gerenciador de Arquivos Avançado (todas as funções do outro app) */
        .filemgr-advanced-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #2B2E33;
        }

        /* Alça Física Virtual para empurrar/puxar no espaço */
        .window-move-bar {
            width: 180px;
            height: 8px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            margin-top: 16px;
            cursor: grab;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            transition: background 0.2s, width 0.2s, height 0.2s, box-shadow 0.2s;
        }
        .window-move-bar:hover {
            background: rgba(255, 255, 255, 0.9);
            height: 10px;
            width: 210px;
            box-shadow: 0 0 15px rgba(0, 102, 254, 0.6);
        }
        .window-move-bar:active {
            cursor: grabbing;
            background: #0066fe;
            box-shadow: 0 0 25px #0066fe;
        }

        /* Dock holográfico curvado em 3D */
        #quest-dock-container {
            position: fixed;
            bottom: 56px;
            left: 50%;
            perspective: 1300px;
            transform: translateX(-50%) rotateX(15deg) translateZ(50px);
            transform-style: preserve-3d;
            z-index: 200000;
            /* A transição de posição some: quem cuida do movimento suave agora é o
               loop de flutuação (requestAnimationFrame), pra ficar sempre "vivo" no ar. */
        }

        #quest-dock {
            background: rgba(10, 10, 18, 0.55);
            backdrop-filter: blur(45px);
            -webkit-backdrop-filter: blur(45px);
            padding: 16px 32px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 22px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            /* Sombra dupla + halo azul suave por baixo: reforça a sensação de painel
               solto no ar, projetando sombra no "vazio" em vez de numa superfície */
            box-shadow: 0 40px 90px rgba(0,0,0,0.8),
                        0 10px 40px rgba(0,102,254,0.25),
                        inset 0 1px 2px rgba(255,255,255,0.3);
            transform-style: preserve-3d;
        }

        .dock-item {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.25s, box-shadow 0.25s;
            border: 1px solid rgba(255, 255, 255, 0.05);
            /* Curvatura do arco simulada só com translateZ (profundidade), SEM rotateY.
               rotateY por item dentro de um pai com preserve-3d/perspective causa o mesmo
               bug de clique do Chromium descrito acima nas janelas: o hit-test desloca do
               ícone real, e como os itens das PONTAS do arco tinham a maior rotação, eram
               justamente os "botões do canto" que não respondiam ao clique. Mantendo só a
               profundidade (translateZ), o efeito espacial continua mas o clique acerta
               sempre o ícone certo, do centro às pontas. */
            transform: translateZ(var(--arc-z, 18px));
        }

        /* "Base" translúcida flutuando abaixo de cada ícone: dá volume real ao botão no eixo Z */
        .dock-item::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(0, 102, 254, 0.35);
            transform: translateZ(-16px) scale(0.82);
            filter: blur(6px);
            opacity: 0.55;
            pointer-events: none;
        }

        .dock-item:hover {
            transform: translateZ(calc(var(--arc-z, 18px) + 55px)) translateY(-14px) scale(1.2);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), 0 0 30px rgba(0,102,254,0.35);
        }

        .dock-item:active {
            transform: translateZ(calc(var(--arc-z, 18px) - 10px)) scale(0.92);
        }

        .dock-item svg { width: 26px; height: 26px; fill: #fff; transform: translateZ(10px); pointer-events: none; }
        .divider { width: 1px; height: 35px; background: rgba(255, 255, 255, 0.2); transform: translateZ(var(--arc-z, 18px)); }

        /* Atalhos fixados pelo usuário: mesmo formato redondo dos ícones do sistema */
        .dock-shortcut { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; }
        .dock-shortcut.move-armed { box-shadow: 0 0 0 3px #0066fe, 0 0 20px rgba(0,102,254,0.8); }

        .dock-context-menu {
            position: fixed; z-index: 999; display: none;
            background: rgba(15,15,25,0.92); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 6px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            animation: dcmPopIn 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        @keyframes dcmPopIn {
            from { opacity: 0; transform: rotateX(-16deg) translateZ(-50px) scale(0.92); }
            to { opacity: 1; transform: rotateX(0deg) translateZ(0) scale(1); }
        }
        /* Camada interna com a curvatura espacial (mesma técnica 2D segura das
           janelas: scaleX + skewY), independente da animação de entrada acima. */
        .dcm-spatial {
            display: flex; flex-direction: column; gap: 4px;
            will-change: transform;
            transition: transform 0.15s ease-out;
        }
        .dock-context-menu button {
            background: transparent; border: none; color: #fff; text-align: left;
            padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12.5px; white-space: nowrap;
        }
        .dock-context-menu button:hover { background: rgba(0,102,254,0.4); }

        /* Botão "+" do dock: abre o popup quadrado com Fábrica de Apps, Otimizador
           e Gerenciador de Arquivos, pra não poluir a barra com um ícone pra cada. */
        .dock-item.plus-dock-item.active {
            background: rgba(0, 102, 254, 0.35);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), 0 0 30px rgba(0,102,254,0.5);
        }

        #launcher-popup {
            position: fixed;
            z-index: 900;
            display: none;
            width: 232px;
            padding: 16px;
            background: rgba(12, 12, 20, 0.85);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 22px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.85), inset 0 1px 2px rgba(255,255,255,0.25);
        }
        #launcher-popup.open {
            display: block;
            animation: launcherPopIn 0.18s cubic-bezier(0.25, 0.8, 0.25, 1),
                       launcherFloatBob 3.2s ease-in-out 0.18s infinite;
        }
        @keyframes launcherPopIn {
            from { opacity: 0; transform: translateY(10px) rotateX(-18deg) translateZ(-60px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) rotateX(0deg) translateZ(0) scale(1); }
        }
        /* Flutuação contínua e sutil — o painel nunca fica 100% estático no ar,
           igual às interfaces reais de VR/MR (referência: apps flutuantes do Quest) */
        @keyframes launcherFloatBob {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-7px) rotateX(1.5deg); }
        }
        /* Camada interna que recebe a curvatura espacial (igual à das janelas,
           .vr-window-rotor): mantém o layout de grade separado da animação de
           entrada do painel externo, pra popup ficar "curvo" como um painel
           flutuante do Meta Quest, com cliques 100% confiáveis (transform 2D puro). */
        .lp-spatial {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            will-change: transform;
            transition: transform 0.15s ease-out;
        }
        .launcher-popup-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 13px 4px 10px;
            cursor: pointer;
            color: #fff;
            transition: background 0.2s, transform 0.2s;
        }
        .launcher-popup-item:hover { background: rgba(0, 102, 254, 0.35); transform: translateY(-3px); }
        .launcher-popup-item svg { width: 22px; height: 22px; fill: #fff; pointer-events: none; }
        .launcher-popup-item span { font-size: 10px; text-align: center; line-height: 1.25; pointer-events: none; }

        /* Gerenciador de Arquivos do Site: lista os apps criados como se fossem arquivos.
           Layout inspirado no gerenciador de arquivos "de verdade" (v3): título com
           selo de marca, contador em mono, ícones quadrados tipo thumbnail, coluna de
           metadados alinhada à direita nas linhas, e barra de status fixa embaixo. */
        /* Layout raiz: barra lateral "Locais/Dispositivos" (estilo Thunar) + painel principal */
        .filemgr-wrap { display: flex; height: 100%; background: #0f1013; }
        .filemgr-sidebar {
            width: 168px; flex: none; background: rgba(255,255,255,0.025);
            border-right: 1px solid rgba(255,255,255,0.07);
            padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
        }
        .filemgr-sidebar-group-label {
            font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
            color: rgba(255,255,255,0.35); padding: 0 8px; margin-bottom: 3px;
        }
        .filemgr-sidebar-item {
            display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px;
            font-size: 12.5px; color: rgba(255,255,255,0.8); cursor: pointer; transition: background 0.15s;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .filemgr-sidebar-item span.si-ic { flex: none; font-size: 13px; width: 16px; text-align: center; }
        .filemgr-sidebar-item:hover { background: rgba(255,255,255,0.06); }
        .filemgr-sidebar-item.active { background: rgba(0,102,254,0.35); color: #fff; }
        .filemgr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
        .filemgr-header { padding: 8px 14px 0; flex: none; }
        .filemgr-navrow { display: flex; align-items: center; gap: 6px; padding-bottom: 8px; }
        .filemgr-navbtn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.85);
            width: 28px; height: 28px; border-radius: 7px; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; justify-content: center; flex: none; transition: background 0.15s;
        }
        .filemgr-navbtn:hover { background: rgba(255,255,255,0.13); }
        .filemgr-navbtn:disabled { opacity: 0.3; cursor: default; }
        .filemgr-navbtn:disabled:hover { background: rgba(255,255,255,0.06); }
        .filemgr-breadcrumb {
            flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 7px; padding: 0 10px; height: 28px; font-size: 12.5px; color: rgba(255,255,255,0.75);
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
        }
        .filemgr-breadcrumb b { color: #fff; font-weight: 600; }
        .filemgr-brand-title { font-size: 14.5px; font-weight: 700; color: #fff; }
        .filemgr-count-badge {
            font-family: 'Courier New', monospace; font-size: 11px; color: #59a6ff;
            background: rgba(89,166,255,0.12); border: 1px solid rgba(89,166,255,0.3);
            border-radius: 6px; padding: 1px 7px;
        }
        .filemgr-toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 8px; }
        .filemgr-toolbar-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .filemgr-search {
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 7px; padding: 0 10px; height: 28px; min-width: 150px; flex: 1;
        }
        .filemgr-search span { color: rgba(255,255,255,0.4); font-size: 12px; }
        .filemgr-search input {
            background: transparent; border: none; outline: none; color: #fff;
            font-size: 12.5px; width: 100%; font-family: inherit;
        }
        .filemgr-search input::placeholder { color: rgba(255,255,255,0.4); }
        .filemgr-icon-btn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #fff;
            height: 28px; min-width: 28px; padding: 0 9px; border-radius: 7px; cursor: pointer;
            font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 5px;
            transition: background 0.2s; white-space: nowrap;
        }
        .filemgr-icon-btn:hover { background: rgba(0,102,254,0.45); }
        .filemgr-icon-btn.active { background: rgba(0,102,254,0.6); border-color: rgba(0,102,254,0.7); }
        .filemgr-icon-btn.danger:hover { background: rgba(255,95,86,0.6); }
        .filemgr-select { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #fff; height: 28px;
            border-radius: 7px; padding: 0 8px; font-size: 12px; cursor: pointer; }
        .filemgr-select option { color: #000; }
        .filemgr-view-toggle { display: flex; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 7px; overflow: hidden; }
        .filemgr-view-toggle .filemgr-icon-btn { background: transparent; border: none; border-radius: 0; }
        .filemgr-view-toggle .filemgr-icon-btn.active { background: rgba(0,102,254,0.55); }
        .filemgr-selbar {
            display: flex; align-items: center; gap: 8px; padding: 8px 14px;
            font-size: 12px; color: rgba(255,255,255,0.7);
            font-family: 'Courier New', monospace;
        }
        .filemgr-selbar .filemgr-icon-btn { margin-left: auto; font-family: inherit; }
        /* Cabeçalho de colunas tipo "explorador de arquivos" (Nome / Tamanho / Tipo) */
        .filemgr-colheader {
            display: flex; align-items: center; gap: 12px; padding: 5px 14px;
            border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03); flex: none;
        }
        .filemgr-colheader .ch-icon-space { width: 26px; flex: none; }
        .filemgr-col {
            font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
            color: rgba(255,255,255,0.4); cursor: pointer; user-select: none; display: flex; align-items: center; gap: 4px;
        }
        .filemgr-col:hover { color: rgba(255,255,255,0.7); }
        .filemgr-col.active { color: #59a6ff; }
        .filemgr-col-name { flex: 1; min-width: 0; }
        .filemgr-col-size { width: 90px; flex: none; text-align: right; justify-content: flex-end; }
        .filemgr-col-type { width: 130px; flex: none; }
        .filemgr-list { flex: 1; overflow-y: auto; padding: 2px 0; display: flex; flex-direction: column; }
        .filemgr-list.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; align-content: start; padding: 14px 16px; }
        .filemgr-row {
            display: flex; align-items: center; gap: 12px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.035);
            padding: 6px 14px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .filemgr-row:nth-child(even) { background: rgba(255,255,255,0.015); }
        .filemgr-row:hover { background: rgba(89,166,255,0.12); }
        .filemgr-row.selected { background: rgba(0,102,254,0.28); }
        .filemgr-row .filemgr-icon { width: 22px; height: 22px; border-radius: 5px; background: transparent; border: none; font-size: 14px; flex: none; }
        .filemgr-row .filemgr-col-name { display: flex; align-items: center; overflow: hidden; }
        .filemgr-row .filemgr-name { font-size: 12.5px; font-weight: 400; }
        .filemgr-row .filemgr-col-size {
            font-family: 'Courier New', monospace; font-size: 11px; color: rgba(255,255,255,0.5);
        }
        .filemgr-row .filemgr-col-type {
            font-size: 11.5px; color: rgba(255,255,255,0.45); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* Linhas simples (sem colunas) usadas na Lixeira */
        .filemgr-row.filemgr-row-plain { gap: 12px; }
        .filemgr-row.filemgr-row-plain .filemgr-icon { width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,0.08); font-size: 15px; }
        .filemgr-row.filemgr-row-plain .filemgr-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
        .filemgr-card {
            display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
            background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; padding: 12px 8px; cursor: pointer; transition: background 0.2s; position: relative;
        }
        .filemgr-card:hover { background: rgba(255,255,255,0.08); }
        .filemgr-card.selected { background: rgba(0,102,254,0.2); border-color: rgba(0,102,254,0.55); }
        .filemgr-card .filemgr-icon { width: 44px; height: 44px; font-size: 16px; }
        .filemgr-card .filemgr-meta { align-items: center; }
        .filemgr-card .filemgr-name { font-size: 11.5px; max-width: 100%; white-space: normal; word-break: break-word; line-height: 1.25; }
        .filemgr-card .filemgr-sub { font-size: 9.5px; }
        .filemgr-checkbox {
            width: 17px; height: 17px; border-radius: 5px; border: 2px solid rgba(255,255,255,0.35);
            flex: none; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent;
        }
        .filemgr-card .filemgr-checkbox { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.4); }
        .filemgr-row.selected .filemgr-checkbox, .filemgr-card.selected .filemgr-checkbox {
            background: #0066fe; border-color: #0066fe; color: #fff;
        }
        .filemgr-icon {
            width: 40px; height: 40px; border-radius: 10px; overflow: hidden; flex: none;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 16px; color: #fff;
        }
        .filemgr-icon img { width: 100%; height: 100%; object-fit: cover; }
        .filemgr-section-label {
            color: rgba(255,255,255,0.5);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 8px 14px 2px;
            grid-column: 1 / -1;
        }
        .filemgr-list.grid-view .filemgr-section-label { padding: 8px 0 -2px 4px; margin-top: 8px; }
        .filemgr-section-label:first-child { margin-top: 0; }
        .filemgr-empty {
            grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 6px; color: rgba(255,255,255,0.4); font-size: 12.5px; padding: 34px 10px;
        }
        .filemgr-empty-icon { font-size: 26px; opacity: 0.6; }
        .filemgr-trash-meta { font-family: 'Courier New', monospace; font-size: 10px; color: rgba(255,255,255,0.4); }
        .filemgr-status-bar {
            padding: 5px 14px; font-family: 'Courier New', monospace; font-size: 11px;
            color: rgba(255,255,255,0.45); border-top: 1px solid rgba(255,255,255,0.08); flex: none;
            display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.02);
        }
        .filemgr-toast {
            position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
            background: rgba(20,20,28,0.95); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 12.5px;
            display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 500; white-space: nowrap; animation: filemgrToastIn 0.18s ease-out;
        }
        @keyframes filemgrToastIn { from { opacity:0; transform: translateX(-50%) translateY(8px) rotateX(-20deg) translateZ(-60px); } to { opacity:1; transform: translateX(-50%) translateY(0) rotateX(0deg) translateZ(0); } }
        .filemgr-toast-undo { color: #59a6ff; cursor: pointer; font-weight: 700; text-decoration: underline; }

        /* Janela de pré-visualização de um arquivo aberto pelo Gerenciador de Arquivos */
        .filepreview-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #050508; }
        .filepreview-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .filepreview-media { max-width: 100%; max-height: 100%; }
        .filepreview-frame { width: 100%; height: 100%; border: none; background: #fff; }
        .filepreview-text {
            width: 100%; height: 100%; margin: 0; padding: 18px; overflow: auto; box-sizing: border-box;
            background: #0c0c12; color: #a2ffa2; font-family: 'Courier New', monospace; font-size: 12.5px;
            white-space: pre-wrap; word-break: break-word;
        }
        .filepreview-unsupported {
            width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 14px; color: rgba(255,255,255,0.7); padding: 24px; text-align: center;
        }
        .filepreview-unsupported-icon { font-size: 48px; }
        .filepreview-editor {
            width: 100%; flex: 1; min-height: 0; margin: 0; padding: 18px; overflow: auto; box-sizing: border-box;
            background: #0c0c12; color: #a2ffa2; font-family: 'Courier New', monospace; font-size: 12.5px;
            white-space: pre; border: none; outline: none; resize: none;
        }
        .filepreview-text-wrap { display: flex; flex-direction: column; height: 100%; }
        .filepreview-toolbar { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 10px; flex: none; background: #0c0c12; }
        .filemgr-list.filemgr-dragover { outline: 2px dashed #59a6ff; outline-offset: -6px; background: rgba(89,166,255,0.06); }
        .filemgr-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .filemgr-name { font-size: 13px; color: #fff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .filemgr-sub { font-size: 11px; color: rgba(255,255,255,0.45); }
        .filemgr-actions { display: flex; gap: 4px; flex: none; }
        .filemgr-action-btn {
            background: rgba(255,255,255,0.08); border: none; color: #fff;
            width: 26px; height: 26px; border-radius: 8px; cursor: pointer; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .filemgr-action-btn:hover { background: rgba(0,102,254,0.45); }
        .filemgr-action-btn.danger:hover { background: rgba(255,95,86,0.6); }

        /* Estilização Interna de Apps */
        .browser-container { display: flex; flex-direction: column; width: 100%; height: 100%; background: #0f0f14; }
        .browser-navbar { display: flex; gap: 8px; padding: 12px; background: rgba(0,0,0,0.4); align-items: center; position: relative; }
        .browser-input {
            flex: 1; background: transparent; border: none;
            padding: 10px 6px 10px 18px; color: #fff; font-size: 13px; outline: none;
        }
        .browser-btn { background: #0066fe; border: none; padding: 8px 16px; border-radius: 14px; color: white; cursor: pointer; font-weight: bold; }
        .browser-frame { flex: 1; border: none; background: white; }

        /* Botões redondos (voltar / menu de 3 pontos) da barra do navegador */
        .browser-icon-btn {
            flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.08); color: #fff; font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .browser-icon-btn:hover { background: rgba(0,102,254,0.5); }
        .browser-icon-btn:disabled { opacity: 0.35; cursor: default; }

        /* Barra de pesquisa: input + lupa dentro do mesmo pílula */
        .browser-search-wrap {
            flex: 1; display: flex; align-items: center; background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 30px; overflow: hidden;
        }
        .browser-search-btn {
            flex: none; width: 36px; height: 36px; margin-right: 4px; border-radius: 50%; border: none;
            background: transparent; color: #cfd6ff; font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .browser-search-btn:hover { background: rgba(0,102,254,0.4); color: #fff; }

        /* Menu suspenso de "..." do navegador (Nova Janela, Zoom, Traduzir, Inspecionar, Criar App) */
        .browser-menu {
            position: absolute; top: 54px; right: 10px; z-index: 50; display: none; flex-direction: column; gap: 2px;
            background: rgba(15,15,25,0.96); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 6px; min-width: 200px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }
        .browser-menu.open { display: flex; }
        .browser-menu button {
            background: transparent; border: none; color: #fff; text-align: left;
            padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 12.5px; white-space: nowrap;
        }
        .browser-menu button:hover { background: rgba(0,102,254,0.4); }

        /* Janela "Criar App do Site" */
        .site-app-preview-row { display: flex; align-items: center; gap: 12px; padding: 4px 16px 14px; }
        .site-app-icon-preview {
            width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: none;
            background: rgba(255,255,255,0.08);
        }

        .factory-container { display: flex; flex-direction: column; height: 100%; padding: 15px; gap: 10px; background: #09090e; }
        .factory-fields { display: flex; gap: 10px; flex-wrap: wrap; }
        .factory-input { background: #14141f; border: 1px solid #2b2b3d; color: white; padding: 10px; border-radius: 8px; flex: 1; min-width: 140px; outline: none; }
        .factory-code { flex: 1; background: #0c0c12; color: #a2ffa2; font-family: 'Courier New', monospace; padding: 14px; border-radius: 12px; resize: none; border: 1px solid #1c1c2b; outline: none; font-size: 13px; }
        .factory-btn { background: #28a745; border: none; padding: 10px 20px; border-radius: 10px; color: white; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .factory-btn-secondary { background: #2b2b3d; }
        .factory-btn-secondary:hover { background: #383852; }
        .factory-btn-test { background: #0066fe; }
        .factory-btn-test:hover { background: #1a75ff; }

        /* Área de edição: alterna entre o textarea de código e o iframe de teste ao vivo */
        .factory-editor-area { flex: 1; display: flex; position: relative; }
        .factory-test-frame { flex: 1; width: 100%; height: 100%; display: none; background: #fff; border-radius: 12px; border: 1px solid #1c1c2b; }
        .factory-editor-area.testing .factory-code { display: none; }
        .factory-editor-area.testing .factory-test-frame { display: block; }

        /* Biblioteca de Apps: cabeçalho com botão de Carregar/Salvar + apagar por app */
        .library-wrap { display: flex; flex-direction: column; height: 100%; }
        .library-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 0; }
        .library-io-toggle-btn {
            background: rgba(255,255,255,0.08); border: none; color: #fff;
            width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 14px;
            transition: background 0.2s;
        }
        .library-io-toggle-btn:hover { background: rgba(0,102,254,0.45); }
        .library-io-panel { display: none; gap: 10px; padding: 12px 20px 0; }
        .library-io-panel.open { display: flex; }
        .library-wrap .app-grid { flex: 1; overflow-y: auto; }

        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 15px; padding: 20px; }
        .app-card { position: relative; background: none; padding: 6px; border-radius: 0; text-align: center; cursor: pointer; border: none; transition: 0.25s; color: white; }
        .app-card h3 { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .app-delete-btn {
            position: absolute; top: 0px; right: 6px;
            background: rgba(255,95,86,0.4); border: none; color: #fff;
            width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
            font-size: 10px; display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s, background 0.2s;
        }
        .app-card:hover .app-delete-btn { opacity: 1; }
        .app-delete-btn:hover { background: rgba(255,95,86,0.85); }
        .app-icon-circle {
            width: 56px; height: 56px; border-radius: 50%; overflow: hidden;
            background: rgba(255,255,255,0.12); margin: 0 auto 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 20px; color: #fff;
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .app-card:hover .app-icon-circle { transform: translateY(-4px) scale(1.06); box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
        .app-icon-circle img { width: 100%; height: 100%; object-fit: cover; }


        .settings-pane { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
        .settings-section-title {
            color: rgba(255,255,255,0.55);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 10px 0 -2px 4px;
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; background: rgba(255,255,255,0.04); padding: 13px 14px; border-radius: 12px; }
        .setting-row span:first-child { font-size: 13.5px; color: #fff; }
        .setting-row.setting-btn-row { cursor: pointer; }
        .settings-select { background: #1a1a26; color: white; border: 1px solid #3d3d52; padding: 6px 12px; border-radius: 8px; outline: none; }
        .settings-range { width: 130px; accent-color: #0066fe; }
        .settings-color { width: 38px; height: 26px; border: none; border-radius: 6px; background: none; cursor: pointer; padding: 0; }
        .settings-action-btn {
            background: rgba(0, 102, 254, 0.25);
            border: 1px solid rgba(0, 102, 254, 0.5);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .settings-action-btn:hover { background: rgba(0, 102, 254, 0.5); }
        .settings-action-btn.danger { background: rgba(255, 95, 86, 0.25); border-color: rgba(255, 95, 86, 0.5); }
        .settings-action-btn.danger:hover { background: rgba(255, 95, 86, 0.5); }

        /* Interruptor (toggle switch) usado nas Configurações */
        .toggle-switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; cursor: pointer; inset: 0;
            background: rgba(255,255,255,0.15);
            border-radius: 24px;
            transition: 0.25s;
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px; height: 18px;
            left: 3px; top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: 0.25s;
        }
        .toggle-switch input:checked + .toggle-slider { background: #0066fe; }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }

        /* ===== PAINEL OTIMIZADOR DO SISTEMA ===== */
        .optimizer-pane { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
        .opt-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .opt-stat-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .opt-stat-label { font-size: 10px; color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
        .opt-stat-value { font-size: 21px; font-weight: 700; color: #fff; }
        .opt-stat-bar-bg { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); margin-top: 9px; overflow: hidden; }
        .opt-stat-bar-fill { height: 100%; border-radius: 3px; width: 0%; transition: width 0.4s ease, background 0.4s ease; }
        .opt-run-btn {
            background: linear-gradient(135deg, #0066fe, #28c76f);
            border: none; color: #fff; padding: 13px; border-radius: 12px;
            font-weight: 700; cursor: pointer; font-size: 13.5px; letter-spacing: 0.3px;
            box-shadow: 0 8px 20px rgba(0,102,254,0.35);

        .opt-run-btn:active { transform: translateY(0); }
        .opt-summary { font-size: 11.5px; color: rgba(255,255,255,0.65); text-align: center; min-height: 14px; }
        .opt-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .opt-app-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; padding-right: 2px; }
        .opt-app-row {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.04); border-radius: 10px; padding: 9px 12px;
            font-size: 12.5px; border-left: 3px solid transparent; transition: border-color 0.2s, background 0.2s;
        }

        .opt-app-info { flex: 1; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .opt-app-title { color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .opt-app-meta { color: rgba(255,255,255,0.5); font-size: 10.5px; text-transform: capitalize; }
        .opt-app-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .opt-mini-btn {
            background: rgba(255,255,255,0.12); border: none; color: #fff;

            font-size: 12px; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .opt-mini-btn:hover { background: rgba(0,102,254,0.5); }
        .opt-mini-btn.danger:hover { background: rgba(255,95,86,0.6); }
        .opt-empty { color: rgba(255,255,255,0.4); font-size: 12.5px; text-align: center; padding: 18px; }

        #camera-status {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(5, 5, 10, 0.8); color: white; padding: 10px 24px; border-radius: 30px; font-size: 13.5px; z-index: 100; border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
        }
        
        .app-sandbox { width: 100%; height: 100%; border: none; background: transparent; }

        /* Retículo Espacial do Ponteiro — estilo Meta Quest 3 (glow + anel de pulso + profundidade) */
        .hand-reticle {
            position: fixed;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 300000;
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%) translateZ(100px) scale(0.6);
            transition: width 0.12s cubic-bezier(.34,1.56,.64,1), height 0.12s cubic-bezier(.34,1.56,.64,1),
                        opacity 0.22s ease, transform 0.12s cubic-bezier(.34,1.56,.64,1);
        }
        .hand-reticle.visible { opacity: 1; transform: translate(-50%, -50%) translateZ(100px) scale(1); }
        .hand-reticle .rt-core {
            position: absolute; inset: 0; border-radius: 50%;
            background: radial-gradient(circle at 34% 30%, rgba(255,255,255,0.95), rgba(120,190,255,0.55) 42%, rgba(0,102,254,0.12) 74%, transparent 78%);
            border: 1.5px solid rgba(255,255,255,0.9);
            box-shadow: 0 0 16px 2px rgba(0,153,255,0.55), 0 0 36px 8px rgba(0,102,254,0.2), inset 0 0 8px rgba(255,255,255,0.85);
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }
        .hand-reticle .rt-pulse {
            position: absolute; inset: -9px; border-radius: 50%;
            border: 1.5px solid rgba(150,200,255,0.45);
            animation: handRtPulse 1.7s ease-out infinite;
        }
        .hand-reticle.hand-left .rt-core {
            background: radial-gradient(circle at 34% 30%, rgba(255,255,255,0.95), rgba(200,120,255,0.55) 42%, rgba(140,0,255,0.12) 74%, transparent 78%);
            box-shadow: 0 0 16px 2px rgba(180,100,255,0.55), 0 0 36px 8px rgba(140,0,255,0.2), inset 0 0 8px rgba(255,255,255,0.85);
        }
        .hand-reticle.hand-left .rt-pulse { border-color: rgba(200,150,255,0.45); }
        .hand-reticle.pinching { width: 15px; height: 15px; }
        .hand-reticle.pinching .rt-core {
            background: radial-gradient(circle at 34% 30%, rgba(255,255,255,0.98), rgba(70,225,140,0.75) 48%, rgba(40,167,69,0.2) 78%);
            box-shadow: 0 0 22px 4px rgba(60,220,130,0.7), 0 0 46px 12px rgba(40,167,69,0.28), inset 0 0 6px rgba(255,255,255,0.9);
        }
        @keyframes handRtPulse {
            0%   { transform: scale(0.55); opacity: 0.85; }
            100% { transform: scale(1.7);  opacity: 0; }
        }
        /* Destaque espacial: elemento "olhado/apontado" pela mão, como no raycast do Quest */
        .spatial-hover {
            outline: 2px solid rgba(0, 153, 255, 0.9) !important;
            outline-offset: 2px;
            box-shadow: 0 0 0 5px rgba(0, 153, 255, 0.16), 0 0 24px rgba(0, 153, 255, 0.5) !important;
            transition: box-shadow 0.15s ease, outline-color 0.15s ease;
        }
        .hand-toggle-active {
            background: #28a745 !important;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.6);
        }
    </style>

    <script>
        // --- MENU 3D: ARCO ESPACIAL DO DOCK + PARALLAX POR PONTEIRO ---
        (function setup3DDock() {
            const dockContainer = document.getElementById('quest-dock-container');
            const dock = document.getElementById('quest-dock');
            const items = Array.from(dock.querySelectorAll('.dock-item'));
            const center = (items.length - 1) / 2;

            // Distribui a profundidade de cada ícone no arco (só translateZ, sem rotateY —
            // ver comentário em .dock-item no CSS sobre o bug de clique nas pontas)
            items.forEach((item, i) => {
                const offset = i - center;
                const depth = 26 - Math.abs(offset) * 5;  // centro mais próximo do usuário, pontas recuam
                item.style.setProperty('--arc-z', `${depth}px`);
            });

            // Base rotation do console (igual ao valor original: rotateX(15deg) translateZ(50px))
            const baseRotX = 15;
            let targetRotX = baseRotX, targetRotY = 0;
            let currentRotX = baseRotX, currentRotY = 0;

            function applyTilt(t) {
                // Suaviza a rotação para um movimento espacial fluido, não travado
                currentRotX += (targetRotX - currentRotX) * 0.08;
                currentRotY += (targetRotY - currentRotY) * 0.08;
                // Flutuação sutil no ar (bob), tipo painel de VR real, que nunca fica 100% parado
                const bobY = Math.sin(t / 1400) * 5;
                const bobZ = Math.sin(t / 2100) * 6;
                dockContainer.style.transform =
                    `translateX(-50%) translateY(${bobY}px) rotateX(${currentRotX}deg) rotateY(${currentRotY}deg) translateZ(${50 + bobZ}px)`;
                requestAnimationFrame(applyTilt);
            }
            requestAnimationFrame(applyTilt);

            window.addEventListener('mousemove', (e) => {
                const nx = (e.clientX / window.innerWidth) * 2 - 1;   // -1 a 1
                const ny = (e.clientY / window.innerHeight) * 2 - 1;  // -1 a 1
                targetRotY = nx * 10;             // menu "olha" na direção do ponteiro
                targetRotX = baseRotX - ny * 6;
            });
        })();

        // --- CONFIGURAÇÃO BASE DO AMBIENTE ---
        const video = document.getElementById('passthrough');
        const skeletonCanvas = document.getElementById('hand-skeleton-canvas');
        const skeletonCtx = skeletonCanvas.getContext('2d');
        const cameraStatus = document.getElementById('camera-status');
        let streamActive = null;
        let handsProcessing = false; // trava simples pra nunca ter 2 frames sendo processados pelo modelo ao mesmo tempo
        // Curvatura 3D ativa por padrão. O bug de clique/flicker era causado por
        // overflow:hidden + backdrop-filter no MESMO elemento que girava (rotateY);
        // agora a rotação vive numa camada separada (.vr-window-rotor) sem overflow
        // nem blur, então a janela pode ser espacial de verdade sem quebrar cliques.
        let globalCurvatureMultiplier = 1;
        let cameraEngine = null;

        // --- ESTADO GLOBAL DAS CONFIGURAÇÕES (15 funções no painel de Configurações) ---
        let defaultFlatMode = false;        // 1. novas janelas nascem planas ou curvas
        let autoUpdateFeatureEnabled = true; // 2. liga/desliga a função de auto-atualização no sistema todo
        let autoUpdateIntervalMs = 5000;     // 3. intervalo da auto-atualização
        let glassOpacity = 0.45;             // 4. opacidade do vidro das janelas
        let blurIntensity = 35;              // 5. intensidade do desfoque (blur)
        let animSpeedMs = 350;               // 6. velocidade de animação das janelas
        let accentColor = '#0066fe';         // 7. cor de destaque do sistema
        let uiSoundEnabled = true;           // 8. sons de interface
        let pinchSensitivity = 0.042;        // 9. sensibilidade da pinça (hand tracking)
        let pointerSmoothing = 0.22;         // 10. suavização do ponteiro (lerp)
        let zDepthLimit = 250;               // 11. limite de profundidade Z
        let showSpatialGrid = false;         // 12. grade espacial de fundo
        let performanceMode = false;         // 13. modo de desempenho (reduz efeitos)
        let antiTremorEnabled = true;        // 14. filtro anti-tremor (IA)
        // 15. curvatura de tela espacial = globalCurvatureMultiplier (já existia)

        const autoUpdateTimers = new WeakMap(); // guarda o setInterval de cada janela
        const optimizerTimers = new WeakMap();  // guarda o setInterval de auto-refresh de cada painel Otimizador aberto
        const IDLE_THRESHOLD_MS = 12000;        // tempo sem interação pra uma janela ser considerada "ociosa" pelo Otimizador

        function playUiSound(freq = 440) {
            if (!uiSoundEnabled) return;
            try {
                const ctx = playUiSound._ctx || (playUiSound._ctx = new (window.AudioContext || window.webkitAudioContext)());
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                osc.connect(gain).connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch (e) { /* áudio bloqueado pelo navegador, ignora */ }
        }

        function applyGlassOpacity(value) {
            glassOpacity = parseFloat(value);
            document.documentElement.style.setProperty('--glass-opacity', glassOpacity);
            document.querySelectorAll('.vr-window').forEach(w => {
                w.style.background = `rgba(15, 15, 25, ${glassOpacity})`;
            });
        }

        function applyBlurIntensity(value) {
            blurIntensity = parseFloat(value);
            document.querySelectorAll('.vr-window').forEach(w => {
                w.style.backdropFilter = `blur(${blurIntensity}px) saturate(160%)`;
                w.style.webkitBackdropFilter = `blur(${blurIntensity}px) saturate(160%)`;
            });
        }

        function applyAnimSpeed(value) {
            animSpeedMs = parseInt(value);
            document.documentElement.style.setProperty('--anim-speed', `${animSpeedMs}ms`);
        }

        function applyAccentColor(value) {
            accentColor = value;
            document.querySelectorAll('.win-rotate.armed, .win-flat.flat-active').forEach(el => {
                el.style.background = accentColor;
                el.style.boxShadow = `0 0 10px ${accentColor}, 0 0 2px #fff`;
            });
        }

        function toggleSpatialGrid(checked) {
            showSpatialGrid = checked;
            document.getElementById('spatial-grid').classList.toggle('grid-visible', showSpatialGrid);
        }

        function togglePerformanceMode(checked) {
            performanceMode = checked;
            document.body.classList.toggle('performance-mode', performanceMode);
            // Reduz a complexidade do modelo de hand tracking em tempo real p/ economizar CPU/GPU
            if (typeof handsEngine !== 'undefined') {
                handsEngine.setOptions({
                    selfieMode: false,
                    maxNumHands: performanceMode ? 1 : 2,
                    modelComplexity: 0,                                  // sempre "lite": é o que dá o melhor equilíbrio velocidade/precisão
                    minDetectionConfidence: performanceMode ? 0.6 : 0.65,
                    minTrackingConfidence: performanceMode ? 0.45 : 0.55
                });
            }
        }

        function toggleAntiTremor(checked) {
            antiTremorEnabled = checked;
            applyHandSmoothingParams();
        }

        function toggleAutoUpdateFeature(checked) {
            autoUpdateFeatureEnabled = checked;
            // Desativar globalmente para todas as janelas que estavam com auto-update ligado
            if (!autoUpdateFeatureEnabled) {
                document.querySelectorAll('.win-auto.auto-active').forEach(btn => stopAutoUpdate(btn));
            }
        }

        function setAutoUpdateInterval(value) {
            autoUpdateIntervalMs = parseInt(value);
            // Reinicia timers já ativos com o novo intervalo
            document.querySelectorAll('.win-auto.auto-active').forEach(btn => {
                const container = btn.closest('.vr-window-container');
                startAutoUpdate(btn, container, true);
            });
        }

        function resetAllWindows() {
            document.querySelectorAll('.vr-window-container').forEach((container, i) => {
                container.style.left = `${20 + (i % 5) * 5}%`;
                container.style.top = `${15 + (i % 5) * 4}%`;
                container.dataset.zDepth = "0";
                container.dataset.manualTiltH = "0";
                container.dataset.manualTiltV = "0";
                makeSpatial(container);
            });
            playUiSound(660);
            refreshAllOptimizerPanels();
        }

        function closeAllWindows() {
            document.querySelectorAll('.vr-window-container').forEach(c => {
                const t1 = autoUpdateTimers.get(c);
                if (t1) clearInterval(t1);
                const t2 = optimizerTimers.get(c);
                if (t2) clearInterval(t2);
                c.remove();
            });
            playUiSound(220);
        }

        // Filtro de suavização (Low-Pass Filter) para estabilizar o tremor
        let smoothedX = window.innerWidth / 2;
        let smoothedY = window.innerHeight / 2;
        let lerpFactor = pointerSmoothing; // Quanto menor, mais suave o ponteiro, porém com leve latência. Ajustável nas Configurações.

        function updatePointerSmoothing(value) {
            pointerSmoothing = parseFloat(value);
            lerpFactor = antiTremorEnabled ? pointerSmoothing : 0.9;
            applyHandSmoothingParams();
        }

        // Ajusta o filtro One Euro de cada mão de acordo com as configurações do usuário.
        // Com o anti-tremor ligado: minCutoff baixo (bem estável). Desligado: minCutoff alto (resposta quase crua).
        function applyHandSmoothingParams() {
            const minCutoff = antiTremorEnabled ? Math.max(0.4, pointerSmoothing * 4) : 6.0;
            const beta = antiTremorEnabled ? 0.55 : 0.15;
            handSlots.forEach(slot => {
                slot.filterX.minCutoff = minCutoff; slot.filterX.beta = beta;
                slot.filterY.minCutoff = minCutoff; slot.filterY.beta = beta;
            });
        }

        // Tenta abrir a câmera com uma lista de constraints, da mais específica pra
        // mais genérica. Em Android é comum a câmera "engasgar" (NotReadableError)
        // quando pede resolução/facingMode muito estritos, ou quando outra aba/app
        // ainda está seguran do o hardware — por isso tentamos de novo com pedidos
        // cada vez mais simples antes de desistir de vez.
        const CAMERA_CONSTRAINT_CHAIN = [
            { video: { facingMode: { exact: "environment" }, width: { ideal: 960 }, height: { ideal: 540 } } },
            { video: { facingMode: { ideal: "environment" }, width: { ideal: 960 }, height: { ideal: 540 } } },
            { video: { facingMode: { ideal: "environment" } } },
            { video: true }
        ];

        async function getCameraStreamWithFallback() {
            let lastErr = null;
            for (const constraints of CAMERA_CONSTRAINT_CHAIN) {
                try {
                    return await navigator.mediaDevices.getUserMedia(constraints);
                } catch (err) {
                    lastErr = err;
                    // NotReadableError geralmente é a câmera ainda "presa" por uma tentativa
                    // anterior (troca rápida de app/aba); um pequeno respiro ajuda o driver
                    // a liberar o dispositivo antes da próxima tentativa da cadeia.
                    if (err && err.name === 'NotReadableError') {
                        await new Promise(r => setTimeout(r, 350));
                    }
                }
            }
            throw lastErr;
        }

        async function initCamera(retryCount = 0) {
            try {
                // Garante que nenhum stream antigo ficou preso ao hardware antes de pedir outro
                if (streamActive) {
                    streamActive.getTracks().forEach(track => track.stop());
                    streamActive = null;
                }
                streamActive = await getCameraStreamWithFallback();
                video.srcObject = streamActive;
                cameraStatus.style.display = 'none';
                
                cameraEngine = new Camera(video, {
                    onFrame: async () => {
                        // Evita empilhar frames se o modelo ainda estiver processando o anterior
                        // (senão a fila cresce e o rastreamento vai ficando cada vez mais atrasado)
                        if (handTrackingActive && !handsProcessing) {
                            handsProcessing = true;
                            try { await handsEngine.send({image: video}); }
                            finally { handsProcessing = false; }
                        }
                    },
                    width: 480,   // menor = inferência mais rápida; landmarks já são normalizados (0-1), então a nitidez visual não muda
                    height: 360
                });
                cameraEngine.start();
            } catch (err) {
                // NotReadableError costuma ser transitório (câmera ainda sendo liberada
                // pelo navegador/SO) — tenta mais uma vez automaticamente antes de desistir
                if (err && err.name === 'NotReadableError' && retryCount < 2) {
                    setTimeout(() => initCamera(retryCount + 1), 500);
                    return;
                }
                const msg = (err && err.name === 'NotReadableError')
                    ? "Câmera ocupada por outro app — feche outras abas/apps que usam a câmera e toque no ícone de câmera pra tentar de novo."
                    : "Modo Espacial 3D Ativo (Sem Câmera)";
                cameraStatus.innerText = msg;
                setTimeout(() => cameraStatus.style.display = 'none', 4500);
            }

        }

        function toggleCamera() {
            if (streamActive) {

        // Fecha a janela e limpa qualquer timer de auto-atualização pendente (evita leak)
        function closeWindowWithCleanup(closeBtn) {
            const container = closeBtn.closest('.vr-window-container');

            if (timerId) clearInterval(timerId);
            autoUpdateTimers.delete(container);
            const optTimerId = optimizerTimers.get(container);
            if (optTimerId) clearInterval(optTimerId);
            optimizerTimers.delete(container);
            const wasAnchored = container.dataset.anchored === '1';
            container.remove();

        }

            container.dataset.anchored = "0";
            container.dataset.flatMode = defaultFlatMode ? '1' : '0';
            container.dataset.lastActive = Date.now();

            container.style.left = `${22 + cascade * 3.5}%`;

            wmSpace.appendChild(container);

            container.addEventListener('mousedown', () => bringToFront(container));

            // dentro da tela (evita cortar nas bordas em telas menores)
            const btnRect = btn.getBoundingClientRect();
            const popRect = popup.getBoundingClientRect();
            let left = btnRect.left + btnRect.width / 2 - popRect.width / 2;
            left = Math.min(Math.max(left, 12), window.innerWidth - popRect.width - 12);
            const top = btnRect.top - popRect.height - 16;
            popup.style.left = `${left}px`;

                initBrowserHistory(container.querySelector('.browser-container'), options.url || 'https://www.wikipedia.org');
                // Correção: dentro das janelas 3D/curvas do sistema, o clique no site
                // às vezes não transfere o foco de teclado pro iframe (o site carrega
                // e aceita clique, mas digitar não funciona). Força o foco no iframe
                // sempre que o usuário clicar dentro dele.
                const browserFrame = container.querySelector('.browser-frame');
                if (browserFrame) {
                    browserFrame.setAttribute('tabindex', '0');
                    browserFrame.addEventListener('mousedown', () => {
                        setTimeout(() => browserFrame.focus(), 0);
                    });
                }
            }
            if (type === 'source-view') {
                loadSourceView(container, options.url || '');
            }
            if (type === 'filemanager-advanced') {
                setupAdvancedFilemgrFallback(container);
            }

            // O painel Otimizador se auto-atualiza sozinho (independente do botão ↻
            // de auto-atualização das outras janelas), pra sempre refletir o estado
            // mais recente de FPS/CPU/RAM e da lista de apps abertos.
            if (type === 'optimizer') {
                renderOptimizerStats(container);
                const timerId = setInterval(() => renderOptimizerStats(container), 2500);
                optimizerTimers.set(container, timerId);
            }
        }

        // Escapa um texto pra poder ser inserido com segurança dentro de um
        // atributo HTML delimitado por aspas duplas (ex: src="...", onerror="...").
        function escapeHtmlAttr(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // Chamado quando o link de imagem da capa (Biblioteca) falha ao carregar:
        // troca a bolinha quebrada pela inicial do nome do app, igual ao fallback
        // que já existe quando nenhum link de imagem foi informado.
        function appIconErrorFallback(imgEl, label) {
            const span = document.createElement('span');
            span.textContent = label ? label.charAt(0).toUpperCase() : '?';
            imgEl.replaceWith(span);
        }

        // Mesma ideia, mas pro tamanho/estilo específico dos ícones da barra (dock)
        function dockIconErrorFallback(imgEl, label) {
            const span = document.createElement('span');
            span.style.color = '#fff';
            span.style.fontWeight = '700';
            span.style.fontSize = '15px';
            span.textContent = label ? label.charAt(0).toUpperCase() : '?';
            imgEl.replaceWith(span);
        }

        // Gera o HTML dos cartões de app usados na Biblioteca (criação e re-render)
        function buildAppGridItemsHTML() {
            if (customApps.length === 0) {
                return `<div class="opt-empty" style="grid-column: 1 / -1;">Nenhum app criado ainda. Use a Fábrica de Apps para criar o primeiro!</div>`;
            }
            return customApps.map((app, index) => {
                const label = app.name || '';
                // Se o link da imagem for inválido (não carregar), onerror troca a
                // imagem pela inicial do nome, em vez de deixar a bolinha quebrada.
                const iconHTML = app.icon
                    ? `<img src="${escapeHtmlAttr(app.icon)}" alt="" onerror="appIconErrorFallback(this, ${escapeHtmlAttr(JSON.stringify(label))})">`
                    : (label ? label.charAt(0).toUpperCase() : '?');
                return `
                <div class="app-card" onclick="openCustomApp(${index})" oncontextmenu="openAppCardMenu(event, ${index})">
                    <button class="app-delete-btn" onmousedown="event.stopPropagation()" onclick="event.stopPropagation(); deleteCustomApp(${index})" title="Apagar app">🗑️</button>
                    <div class="app-icon-circle">${iconHTML}</div>
                    <h3>${app.name}</h3>
                </div>`;
            }).join('');
        }

        // --- GERENCIADOR DE ARQUIVOS DO SITE ---
        // Mostra duas coisas juntas: os apps guardados em customApps (mesma lista
        // da Biblioteca) E qualquer arquivo "cru" que o usuário enviar (imagem,
        // texto, PDF, etc. — ficam em siteFiles). Tudo em ícones redondos, com
        // ações de abrir/editar/renomear/baixar/apagar por linha.
        function formatBytes(bytes) {
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
        }

        function getCustomAppSizeBytes(app) {
            return new Blob([JSON.stringify(app)]).size;
        }

        function getFileManagerTotals() {
            const showApps = filemgrState.filter !== 'files';
            const showFiles = filemgrState.filter !== 'apps';
            const appsBytes = showApps ? customApps.reduce((sum, a) => sum + getCustomAppSizeBytes(a), 0) : 0;
            const filesBytes = showFiles ? siteFiles.reduce((sum, f) => sum + (f.size || 0), 0) : 0;
            return {
                count: (showApps ? customApps.length : 0) + (showFiles ? siteFiles.length : 0),
                bytes: appsBytes + filesBytes
            };
        }

        // --- GERENCIADOR DE ARQUIVOS AVANÇADO (importado do app "gerenciador-arquivos-v3.html") ---
        // Traz TODAS as funções do outro gerenciador de arquivos (árvore de pastas,
        // armazenamento em IndexedDB, arrastar-e-soltar, editor de texto com destaque
        // de sintaxe, pré-visualização de mídia, recortar/copiar/colar, mover para
        // pasta, desfazer (Ctrl+Z), exportar/importar backup em .json, exportar .zip,
        // lixeira, atalhos de teclado, arraste em touch, etc.) direto para dentro do
        // app Gerenciador de Arquivos deste sistema. Em vez de reescrever cada função
        // manualmente num espaço global compartilhado (o que arriscaria colidir nomes
        // com o gerenciador simples já existente, já que os dois usam um objeto de
        // estado 'S'/'filemgrState' bem diferentes), o HTML original completo do outro
        // app é embutido (em Base64, em ADVANCED_FILEMGR_HTML_B64 acima) e roda dentro
        // de um iframe isolado — assim TODAS as funções dele continuam funcionando
        // exatamente como no arquivo original, sem nenhuma perda de funcionalidade.
        //
        // IMPORTANTE — por que isso usa Blob URL e NÃO "data:" direto no src do iframe:
        // um iframe com src="data:text/html;base64,..." roda numa origem "opaca" (nula),
        // e o navegador BLOQUEIA IndexedDB nesse tipo de origem (erro de segurança ao
        // abrir o banco). Como o gerenciador avançado salva tudo em IndexedDB, isso fazia
        // ele nunca conseguir gravar/carregar nada (pastas/arquivos "sumiam" ou a tela
        // ficava travada em "carregando..."). Convertendo o mesmo HTML para um Blob e
        // usando URL.createObjectURL(), o iframe passa a herdar a origem desta própria
        // página (mesma origem), e o IndexedDB funciona normalmente.
        let advancedFilemgrBlobUrl = null;
        function getAdvancedFilemgrBlobUrl() {
            if (advancedFilemgrBlobUrl) return advancedFilemgrBlobUrl;
            const binStr = atob(ADVANCED_FILEMGR_HTML_B64);
            const bytes = new Uint8Array(binStr.length);
